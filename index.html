<script type="text/babel">
// Nav
// Nav.jsx — Estudio Graphica landing UI kit

const TOKEN = {

const CAL_ATTRS = {

  'data-cal-namespace': 'reunion',
  'data-cal-config': '{"layout":"month_view","useSlotsViewOnSmallScreen":"true","theme":"light"}',
};

const NAV_LINKS = [
  { label: 'Inicio', href: '#hero' },
  { label: 'Proceso', href: '#proceso' },
  { label: 'Portafolio', href: '#portafolio' },
  { label: 'Planes', href: '/precios', external: true },
  { label: 'Pablo', href: '#sobre' },
];

const navStyles = {
  nav: {
    position: 'fixed', top: 0, left: 0, right: 0, zIndex: 100,
    transition: 'all 0.28s',
  },
  inner: {
    display: 'flex', alignItems: 'center', justifyContent: 'space-between',
    maxWidth: 1280, margin: '0 auto', padding: '16px 24px',
  },
  logo: { height: 42, width: 'auto', display: 'block' },
  links: {
    display: 'flex', gap: 32, alignItems: 'center',
  },
  link: {
    fontFamily: "'DM Sans', sans-serif", fontSize: 14, fontWeight: 500,
    color: TOKEN.dark, textDecoration: 'none', transition: 'color 0.2s',
    padding: '6px 0', position: 'relative',
  },
  btn: {
    display: 'inline-flex', alignItems: 'center', gap: 8,
    fontFamily: "'Izmir', 'Syne', sans-serif", fontWeight: 700, fontSize: 13,
    padding: '12px 22px', borderRadius: 9999, background: TOKEN.dark,
    color: TOKEN.offWhite, border: 'none', cursor: 'pointer', textDecoration: 'none',
    transition: 'all 0.28s',
  },
};

function NavBar({ onCTA }) {
  const [scrolled, setScrolled] = React.useState(false);
  const [hoverIdx, setHoverIdx] = React.useState(-1);
  React.useEffect(() => {
    const handler = () => setScrolled(window.scrollY > 40);
    window.addEventListener('scroll', handler);
    return () => window.removeEventListener('scroll', handler);
  }, []);

  const handleNav = (e, href) => {
    if (!href.startsWith('#')) return; // link externo (ej. /precios): navegación normal
    e.preventDefault();
    const el = document.querySelector(href);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  return (
    <nav style={{
      ...navStyles.nav,
      background: scrolled ? 'rgba(255,255,255,0.94)' : 'rgba(255,255,255,0.65)',
      backdropFilter: 'blur(16px)',
      boxShadow: scrolled ? '0 2px 20px rgba(24,24,24,0.06)' : 'none',
    }}>
      <div style={navStyles.inner}>
        <a href="#hero" onClick={e => handleNav(e, '#hero')}>
          <img
            src={window.IMG.isoNegro}
            alt="Estudio Graphica"
            style={navStyles.logo}
          />
        </a>
        <div className="eg-nav-links" style={navStyles.links}>
          {NAV_LINKS.map((link, i) => (
            <a
              key={link.href}
              href={link.href}
              onClick={e => handleNav(e, link.href)}
              style={{ ...navStyles.link, color: hoverIdx === i ? TOKEN.dark : TOKEN.grayText, fontWeight: hoverIdx === i ? 600 : 500 }}
              onMouseEnter={() => setHoverIdx(i)}
              onMouseLeave={() => setHoverIdx(-1)}
            >{link.label}</a>
          ))}
        </div>
        <a
          href="#cta"
          {...CAL_ATTRS}
          onClick={e => { e.preventDefault(); }}
          style={navStyles.btn}
          onMouseEnter={e => { e.currentTarget.style.background = '#000'; e.currentTarget.style.transform = 'translateY(-2px)'; }}
          onMouseLeave={e => { e.currentTarget.style.background = TOKEN.dark; e.currentTarget.style.transform = 'translateY(0)'; }}
        >
          Agendar llamada
        </a>
      </div>
      <style>{`
        @media (max-width: 880px) { .eg-nav-links { display: none !important; } }
      `}</style>
    </nav>
  );
}

Object.assign(window, { NavBar, TOKEN, WHATSAPP_URL, CAL_URL, CAL_ATTRS, NAV_LINKS });

</script>

// Sections

function Tag({ children, dark }) {

function Cursive({ children }) {
  return <span style={{ fontFamily: "'Playfair Display', serif", fontStyle: 'italic', fontWeight: 700 }}>{children}</span>;
}

// Reveal-on-scroll wrapper
function Reveal({ children, delay = 0, style = {} }) {
  const ref = React.useRef(null);
  const [visible, setVisible] = React.useState(false);
  React.useEffect(() => {
    if (!ref.current) return;
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { setVisible(true); obs.disconnect(); } });
    }, { threshold: 0.15 });
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return (
    <div ref={ref} style={{
      ...style,
      opacity: visible ? 1 : 0,
      transform: visible ? 'translateY(0)' : 'translateY(30px)',
      transition: `opacity 0.7s ease ${delay}s, transform 0.7s ease ${delay}s`,
    }}>{children}</div>
  );
}

// ProblemSection — with Antes/Después comparison slider
function ProblemSection() {
  const [pos, setPos] = React.useState(50);
  const boxRef = React.useRef(null);
  const draggingRef = React.useRef(false);          // mouse drag active
  const touchRef = React.useRef(null);              // { x, y, mode: null|'h'|'v' }

  const setFromX = React.useCallback((clientX) => {
    if (!boxRef.current) return;
    const r = boxRef.current.getBoundingClientRect();
    let p = ((clientX - r.left) / r.width) * 100;
    if (p < 0) p = 0; if (p > 100) p = 100;
    setPos(p);
  }, []);

  React.useEffect(() => {
    // --- Mouse (desktop): drag while button held ---
    const onMouseMove = (e) => {
      if (!draggingRef.current) return;
      setFromX(e.clientX);
    };
    const onMouseUp = () => { draggingRef.current = false; };

    // --- Touch (mobile): decide direction on first move ---
    const onTouchMove = (e) => {
      const t = touchRef.current;
      if (!t) return;
      const x = e.touches[0].clientX, y = e.touches[0].clientY;
      if (t.mode === null) {
        const dx = Math.abs(x - t.x), dy = Math.abs(y - t.y);
        if (dx < 6 && dy < 6) return;               // wait until intent is clear
        t.mode = dx > dy ? 'h' : 'v';               // horizontal = slide, vertical = scroll
      }
      if (t.mode === 'h') {
        if (e.cancelable) e.preventDefault();        // lock the page only for horizontal drags
        setFromX(x);
      }
      // mode 'v' → do nothing, let the page scroll normally
    };
    const onTouchEnd = () => { touchRef.current = null; };

    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('mouseup', onMouseUp);
    window.addEventListener('touchmove', onTouchMove, { passive: false });
    window.addEventListener('touchend', onTouchEnd);
    window.addEventListener('touchcancel', onTouchEnd);
    return () => {
      window.removeEventListener('mousemove', onMouseMove);
      window.removeEventListener('mouseup', onMouseUp);
      window.removeEventListener('touchmove', onTouchMove);
      window.removeEventListener('touchend', onTouchEnd);
      window.removeEventListener('touchcancel', onTouchEnd);
    };
  }, [setFromX]);

  const s = {

    cmpImg: { position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', display: 'block' },
    cmpBefore: { position: 'absolute', inset: 0, overflow: 'hidden', zIndex: 2 },

      letterSpacing: '0.12em', textTransform: 'uppercase',
      padding: '6px 12px', borderRadius: 9999, zIndex: 5,
    }),
  };

  return (

      <div style={s.container}>
        <Reveal>
          <Tag dark>¿Por qué una sesión de fotos?</Tag>
          <h2 style={s.h2}>Tu comida sabe mejor de lo que <span style={s.accent}>se ve</span>.</h2>
          <p style={s.lead}>"La gente come primero con los <Cursive>ojos</Cursive>." Y si lo que ven primero es una foto del celular, no le haces justicia a tantas horas cocinando.</p>
          <ul style={s.bullets}>
            {['¿Los clientes te buscan pero eligen la "opción segura" que ya conocen?','¿Tienes fotos diferentes en Instagram y en Pedidos Ya?.','¿Pagas anuncios o apps de delivery y aún así no mejoras en ventas?'].map((t,i) => (
              <li key={i} style={s.bullet}><span style={s.dot}></span>{t}</li>
            ))}
          </ul>
        </Reveal>
        <Reveal delay={0.15}>
          <div
            ref={boxRef}
            className="eg-no-select"
            style={s.cmpWrap}
            onMouseDown={(e) => { draggingRef.current = true; setFromX(e.clientX); }}
            onTouchStart={(e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY, mode: null }; }}
          >
            <img src={window.IMG.cmpDespues} alt="Después — Estudio Graphica" style={s.cmpImg} />
            <div style={{ ...s.cmpBefore, clipPath: `polygon(0 0, ${pos}% 0, ${pos}% 100%, 0 100%)` }}>

          <p style={{ textAlign: 'center', marginTop: 12, fontSize: 12, color: 'rgba(248,248,248,0.5)', fontStyle: 'italic' }}>← Desliza de un lado a otro para ver la diferencia→</p>

    { src: 'marca9', url: 'https://res.cloudinary.com/dplhu2z6j/image/upload/w_1100,q_auto,f_auto/v1749166375/9_vuxq3e.png', alt: 'Para Ti' },
    { src: 'marca10', url: 'https://res.cloudinary.com/dplhu2z6j/image/upload/w_1100,q_auto,f_auto/v1749166376/10_p2jdke.png', alt: 'Cookie Bar' },
  ].map(l => ({ alt: l.alt, src: l.url }));

  React.useEffect(() => {
    const wrap = wrapRef.current, track = trackRef.current;
    if (!wrap || !track) return;
    // Clonar para loop infinito
    const originals = Array.prototype.slice.call(track.children);
    originals.forEach(n => track.appendChild(n.cloneNode(true)));

    let pos = 0, baseSpeed = 0.9, speed = baseSpeed, raf = null;
    let dragging = false, startX = 0, startPos = 0, lastX = 0, lastT = 0, velocity = 0;
    const THROW = 3.2, FRICTION = 0.94, MAX = 5;

    const half = () => track.scrollWidth / 2;
    function normalize() { const h = half(); if (pos < 0) pos = h + (pos % h); if (pos >= h) pos %= h; }
    function loop() {
      pos += speed; normalize();
      track.style.transform = `translateX(${-pos}px)`;
      raf = requestAnimationFrame(loop);
    }
    function start() { if (!raf) raf = requestAnimationFrame(loop); }
    function stop() { if (raf) { cancelAnimationFrame(raf); raf = null; } }

    function getX(e) { return e.touches ? e.touches[0].pageX : e.pageX; }
    function onDown(e) {
      dragging = true; wrap.classList.add('eg-dragging'); stop();
      startX = getX(e); startPos = pos; lastX = startX; lastT = performance.now(); velocity = 0;
    }
    function onMove(e) {
      if (!dragging) return;
      if (e.cancelable) e.preventDefault();
      const x = getX(e), now = performance.now(), dx = x - startX;
      pos = startPos - dx; normalize();
      track.style.transform = `translateX(${-pos}px)`;
      const dt = Math.max(1, now - lastT); const v = (x - lastX) / dt;
      velocity = 0.8 * velocity + 0.2 * v; lastX = x; lastT = now;
    }
    function onUp() {
      if (!dragging) return; dragging = false; wrap.classList.remove('eg-dragging');
      const boost = Math.max(Math.min(velocity * THROW, MAX), -MAX);
      speed = baseSpeed - boost;
      (function decay() {
        speed = baseSpeed + (speed - baseSpeed) * FRICTION;
        if (Math.abs(speed - baseSpeed) > 0.05) requestAnimationFrame(decay);
        else speed = baseSpeed;
      })();
      start();
    }

    wrap.addEventListener('mousedown', onDown);
    wrap.addEventListener('touchstart', onDown, { passive: false });
    window.addEventListener('mousemove', onMove, { passive: false });
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('mouseup', onUp);
    window.addEventListener('touchend', onUp);
    wrap.addEventListener('mouseenter', stop);
    wrap.addEventListener('mouseleave', () => { if (!dragging) start(); });
    const onVis = () => { if (document.hidden) stop(); else if (!dragging) start(); };
    document.addEventListener('visibilitychange', onVis);
    start();

    return () => {
      stop();
      wrap.removeEventListener('mousedown', onDown);
      wrap.removeEventListener('touchstart', onDown);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('touchmove', onMove);
      window.removeEventListener('mouseup', onUp);
      window.removeEventListener('touchend', onUp);
      document.removeEventListener('visibilitychange', onVis);
    };
  }, []);

  const s = {
    section: { background: TOKEN.offWhite, padding: 'clamp(64px, 9vw, 110px) 0', overflow: 'hidden' },
    container: { maxWidth: 1200, margin: '0 auto', padding: '0 24px' },

    sub: { fontSize: 15, color: TOKEN.grayText, maxWidth: 520, margin: '12px auto 0', lineHeight: 1.65 },
    scroll: { overflow: 'hidden', cursor: 'grab', maskImage: 'linear-gradient(to right, transparent, #000 7%, #000 93%, transparent)', WebkitMaskImage: 'linear-gradient(to right, transparent, #000 7%, #000 93%, transparent)' },
    track: { display: 'flex', gap: 20, padding: '4px 0', willChange: 'transform', width: 'max-content' },
    card: { width: 168, height: 104, flex: '0 0 auto', display: 'flex', alignItems: 'center', justifyContent: 'center', background: '#fff', borderRadius: 18, padding: 22, border: '1px solid rgba(24,24,24,0.06)', boxShadow: '0 4px 16px rgba(24,24,24,0.05)' },
    logo: { maxWidth: '100%', maxHeight: '100%', objectFit: 'contain', userSelect: 'none', WebkitUserDrag: 'none', pointerEvents: 'none' },

<script type="text/babel">
// Portfolio
// Portfolio.jsx — Estudio Graphica

function PortfolioSection({ onCTA }) {
  const [hovered, setHovered] = React.useState(null);
  const [lightbox, setLightbox] = React.useState(null); // index | null

  // 12 images = 3 cols × 4 rows, all cells filled
  const portfolioImages = [
    { src: window.IMG.imgChanchi, alt: 'Chanchi Broaster' },
    { src: window.IMG.imgBros, alt: 'Bros' },
    { src: window.IMG.imgCookie, alt: 'Cookie Bar' },
    { src: window.IMG.imgVitz, alt: 'Vitz' },
    { src: window.IMG.imgMama, alt: 'Mama Chicken' },
    { src: window.IMG.imgHappyTea, alt: 'Happy Tea' },
    { src: window.IMG.imgHappyFry, alt: 'Happy Fry' },
    { src: window.IMG.imgSansei, alt: 'Sansei' },
    { src: window.IMG.imgEden, alt: 'El Edén' },
    { src: window.IMG.imgGlobos, alt: 'Globos' },
    { src: window.IMG.imgPatata, alt: 'Patata Brava' },
    { src: window.IMG.imgBurger, alt: 'Burger 91' },
  ];

  const open = (i) => setLightbox(i);
  const close = () => setLightbox(null);
  const next = React.useCallback(() => setLightbox(i => i === null ? i : (i + 1) % portfolioImages.length), [portfolioImages.length]);
  const prev = React.useCallback(() => setLightbox(i => i === null ? i : (i - 1 + portfolioImages.length) % portfolioImages.length), [portfolioImages.length]);

  // Keyboard nav + lock scroll while open
  React.useEffect(() => {
    if (lightbox === null) return;
    const onKey = (e) => {
      if (e.key === 'Escape') close();
      else if (e.key === 'ArrowRight') next();
      else if (e.key === 'ArrowLeft') prev();
    };
    window.addEventListener('keydown', onKey);
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => {
      window.removeEventListener('keydown', onKey);
      document.body.style.overflow = prevOverflow;
    };
  }, [lightbox, next, prev]);

  // Swipe handling
  const touch = React.useRef({ x: 0, y: 0, active: false });
  const onTouchStart = (e) => { const t = e.touches[0]; touch.current = { x: t.clientX, y: t.clientY, active: true }; };
  const onTouchEnd = (e) => {
    if (!touch.current.active) return;
    touch.current.active = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - touch.current.x;
    const dy = t.clientY - touch.current.y;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) next(); else prev();
    }
  };

  const s = {
    section: { background: TOKEN.dark, padding: 'clamp(64px, 10vw, 120px) 0' },
    container: { maxWidth: 1160, margin: '0 auto', padding: '0 24px' },
    header: { textAlign: 'center', marginBottom: 48 },
    h2: { fontFamily: "'Izmir', 'Syne', sans-serif", fontWeight: 800, fontSize: 'clamp(1.8rem, 4vw, 3rem)', lineHeight: 1.1, letterSpacing: '-0.02em', color: '#f8f8f8' },
    sub: { color: 'rgba(248,248,248,0.5)', maxWidth: 500, margin: '12px auto 0', fontSize: 15, lineHeight: 1.65 },
    grid: { display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 12 },
    item: { position: 'relative', borderRadius: 10, overflow: 'hidden', cursor: 'zoom-in', aspectRatio: '4/3' },
    img: { width: '100%', height: '100%', objectFit: 'cover', display: 'block', transition: 'transform 0.45s cubic-bezier(0.4,0,0.2,1)' },
    overlay: { position: 'absolute', inset: 0, background: 'linear-gradient(to top, rgba(24,24,24,0.7) 0%, transparent 60%)', transition: 'all 0.28s', display: 'flex', alignItems: 'flex-end', padding: 16 },
    overlayLabel: { fontFamily: "'Izmir','Syne',sans-serif", fontWeight: 700, fontSize: 14, color: '#fff' },
    expandIcon: { position: 'absolute', top: 12, right: 12, width: 32, height: 32, borderRadius: '50%', background: 'rgba(24,24,24,0.55)', backdropFilter: 'blur(4px)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: TOKEN.yellow, fontSize: 15 },
  };

  // Lightbox styles
  const lb = {
    backdrop: { position: 'fixed', inset: 0, zIndex: 1000, background: 'rgba(10,10,10,0.94)', display: 'flex', alignItems: 'center', justifyContent: 'center', animation: 'eg-lb-fade 0.25s ease both' },
    stage: { position: 'relative', zIndex: 1, width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 'clamp(16px, 5vw, 64px)', touchAction: 'pan-y' },
    img: { maxWidth: '100%', maxHeight: '100%', objectFit: 'contain', borderRadius: 8, boxShadow: '0 30px 90px rgba(0,0,0,0.5)', userSelect: 'none', WebkitUserDrag: 'none', pointerEvents: 'none' },
    caption: { position: 'absolute', zIndex: 6, bottom: 'max(20px, env(safe-area-inset-bottom))', left: '50%', transform: 'translateX(-50%)', display: 'flex', alignItems: 'center', gap: 12, color: 'rgba(248,248,248,0.85)', fontFamily: "'Izmir','Syne',sans-serif", fontWeight: 700, fontSize: 14, background: 'rgba(24,24,24,0.55)', padding: '8px 18px', borderRadius: 9999 },
    counter: { fontFamily: "'DM Sans',sans-serif", fontWeight: 400, fontSize: 12, color: 'rgba(248,248,248,0.5)' },
    close: { position: 'fixed', zIndex: 20, top: 'max(16px, env(safe-area-inset-top))', right: 18, width: 50, height: 50, borderRadius: '50%', border: 'none', background: 'rgba(255,255,255,0.14)', color: '#fff', fontSize: 24, lineHeight: 1, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'background 0.2s', WebkitTapHighlightColor: 'transparent', touchAction: 'manipulation' },
    nav: (side) => ({ position: 'fixed', top: '50%', [side]: 'clamp(8px, 2vw, 28px)', transform: 'translateY(-50%)', width: 52, height: 52, borderRadius: '50%', border: 'none', background: 'rgba(255,255,255,0.14)', color: '#fff', fontSize: 24, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'background 0.2s', zIndex: 10, WebkitTapHighlightColor: 'transparent', touchAction: 'manipulation' }),
  };

  return (
    <section id="portafolio" style={s.section}>
      <div style={s.container}>
        <div style={s.header}>
          <Tag dark>Portafolio</Tag>
          <h2 style={s.h2}>Un cliente feliz es la mejor publicidad.</h2>
          <p style={s.sub}>Cada restaurante tiene una historia que contar. Esto es lo que pasa cuando esa historia se cuenta bien.</p>
        </div>
        <div style={s.grid}>
          {portfolioImages.map((img, i) => (
            <div
              key={i}
              style={s.item}
              onClick={() => open(i)}
              onMouseEnter={() => setHovered(i)}
              onMouseLeave={() => setHovered(null)}
            >

                alt={img.alt}
                loading="lazy"
                style={{
                  ...s.img,
                  transform: hovered === i ? 'scale(1.06)' : 'scale(1)',

              />
              <div style={{ ...s.overlay, opacity: hovered === i ? 1 : 0 }}>
                <span style={s.overlayLabel}>{img.alt}</span>
              </div>
              <div style={{ ...s.expandIcon, opacity: hovered === i ? 1 : 0, transition: 'opacity 0.28s' }}>⤢</div>
            </div>
          ))}
        </div>
        <div style={{ textAlign: 'center', marginTop: 40 }}>
          <a
            href="https://www.pinterest.com/estudiographicaph/_saved/" target="_blank" rel="noopener"
            style={{ display: 'inline-flex', alignItems: 'center', gap: 8, fontFamily: "'Izmir','Syne',sans-serif", fontWeight: 700, fontSize: 15, padding: '15px 28px', borderRadius: 9999, background: 'transparent', color: '#f8f8f8', border: '2px solid rgba(248,248,248,0.5)', cursor: 'pointer', transition: 'all 0.28s', textDecoration: 'none' }}
            onMouseEnter={e => { e.currentTarget.style.background = TOKEN.yellow; e.currentTarget.style.color = TOKEN.dark; e.currentTarget.style.borderColor = TOKEN.yellow; }}
            onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = '#f8f8f8'; e.currentTarget.style.borderColor = 'rgba(248,248,248,0.5)'; }}
          >
            Ver portafolio completo →
          </a>
        </div>
      </div>

      {lightbox !== null && (
        <div style={lb.backdrop} onClick={close}>
          <button style={lb.close} aria-label="Cerrar"
            onClick={(e) => { e.stopPropagation(); close(); }}
            onMouseEnter={e => e.currentTarget.style.background = 'rgba(255,255,255,0.22)'}
            onMouseLeave={e => e.currentTarget.style.background = 'rgba(255,255,255,0.1)'}
          >✕</button>
          <button style={lb.nav('left')} aria-label="Anterior"
            onClick={(e) => { e.stopPropagation(); prev(); }}

          <div style={lb.stage} onClick={(e) => e.stopPropagation()}
            onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}
          >
            <img key={lightbox} src={portfolioImages[lightbox].src} alt={portfolioImages[lightbox].alt} style={lb.img} className="eg-lb-img" />
          </div>
          <div style={lb.caption} onClick={(e) => e.stopPropagation()}>
            <span>{portfolioImages[lightbox].alt}</span>
            <span style={lb.counter}>{lightbox + 1} / {portfolioImages.length}</span>
          </div>
        </div>
      )}

      <style>{`
        @keyframes eg-lb-fade { from { opacity: 0; } to { opacity: 1; } }
        @keyframes eg-lb-img-in { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
        .eg-lb-img { animation: eg-lb-img-in 0.3s ease both; }
        @media (max-width: 720px) {
          #portafolio div[style*="grid-template-columns: repeat(3, 1fr)"] { grid-template-columns: repeat(2, 1fr) !important; }
        }
      `}</style>
    </section>
  );
}

Object.assign(window, { PortfolioSection });

</script>

<script>
  // ═══════════ Tracking de conversiones (Pixel + GA4) ═══════════
  // Delegación de eventos a nivel document: cubre los 3 botones de
  // "Agendar llamada" (nav, hero, CTA final), los 2 botones de
  // portafolio, y los links de WhatsApp, sin duplicar lógica en cada
  // componente React.
  //
  // IMPORTANTE — por qué "Lead" NO se dispara aquí en el click:
  // Marcar "Lead" (evento estándar de Meta) en el momento del click es
  // optimista: esa persona solo abrió el widget de Cal, todavía no
  // agendó nada. El evento "Lead" real y verificado se manda por
  // Conversions API server-side (netlify/functions/cal-webhook.js)
  // SOLO cuando Cal.com confirma que el booking se creó de verdad. Así
  // "Lead" en Ads Manager significa lead real, no "alguien tocó un botón".
  //
  // El click en "Agendar llamada" sí manda un evento CUSTOM de
  // intención ("interesado_reunion"), útil para medir cuánta gente
  // abre el calendario aunque no todos terminen agendando — pero sin
  // inflar la métrica estándar de Lead que usas para optimizar la campaña.
  //
  // Deduplicación con CAPI: al hacer click generamos un event_id ANTES
  // de abrir el widget de Cal y lo mandamos como metadata al booking.
  // cal-webhook.js reusa ese mismo event_id al mandar el Lead real por
  // CAPI, así Meta deduplica si en algún punto decides trackear el
  // mismo evento en ambos lados.
  document.addEventListener('DOMContentLoaded', function () {
    if (!window.EG) return;

    // Evento de llegada desde el blog (una sola vez, al cargar)
    window.EG.trackBlogReferrerIfApplicable();

    document.addEventListener('click', function (e) {
      // Botón/link de agendar reunión (nav, hero, CTA final)
      var calBtn = e.target.closest('[data-cal-namespace="reunion"]');
      if (calBtn) {
        var eventId = window.EG.prepareCalBooking('reunion', 'interesado_reunion');
        window.EG.trackCustomEvent('interesado_reunion', {
          content_name: 'Agendar llamada',
          origen: window.EG.getOrigen(),
          event_id: eventId,
        });
        return;
      }

      // Botones de portafolio: el <button> interno "Quiero chismosear
      // tu portafolio" (scroll a la sección) y el <a> "Ver portafolio
      // completo" (link externo a Pinterest). Ninguno tiene clase CSS
      // propia, así que los detectamos por el texto del botón.
      var portfolioBtn = e.target.closest('button, a');
      if (portfolioBtn) {
        var txt = (portfolioBtn.textContent || '').toLowerCase();
        if (txt.includes('portafolio') || txt.includes('chismosear')) {
          window.EG.trackCustomEvent('vio_portafolio', {
            content_name: portfolioBtn.textContent.trim().slice(0, 60),
            origen: window.EG.getOrigen(),
          });
          return;
        }
      }

      // WhatsApp
      var waLink = e.target.closest('a[href*="wa.me"], a[href*="api.whatsapp.com"]');
      if (waLink) {
        window.EG.trackEvent('Contact', {
          content_name: 'WhatsApp',
          origen: window.EG.getOrigen(),
        });
      }
    });
  });
</script>
