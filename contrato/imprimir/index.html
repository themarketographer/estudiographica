<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Contrato para firma física · Estudio Graphica</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
@font-face{font-family:"Izmir";font-weight:300;src:url("/fonts/izmir-light.woff2") format("woff2")}
@font-face{font-family:"Izmir";font-weight:400 500;src:url("/fonts/izmir-regular.woff2") format("woff2")}
@font-face{font-family:"Izmir";font-weight:600 700;src:url("/fonts/izmir-bold.woff2") format("woff2")}
@font-face{font-family:"Izmir";font-weight:800 900;src:url("/fonts/izmir-extrabold.woff2") format("woff2")}
:root{--y:#ffdd5a;--ink:#181818;--muted:#6b6b6b;--hair:#cfcfcf}
@page{size:Letter;margin:18mm 18mm 20mm;@bottom-right{content:counter(page) " / " counter(pages);font:400 8pt Izmir,sans-serif;color:#6b6b6b}}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:#f4f4f2;font:400 10pt/1.55 Izmir,"Helvetica Neue",Arial,sans-serif;color:var(--ink)}
.bar{position:sticky;top:0;z-index:2;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 18px;background:var(--ink);color:#f8f8f8;font-size:13px}
.bar button{font:700 14px Izmir,sans-serif;background:var(--y);color:var(--ink);border:0;border-radius:99px;padding:10px 20px;cursor:pointer}
.hoja{max-width:210mm;margin:18px auto;background:#fff;padding:18mm;box-shadow:0 10px 40px -20px rgba(0,0,0,.3)}
.cab{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1.5px solid var(--ink);position:relative}
.cab::after{content:"";position:absolute;left:0;bottom:-3px;width:46px;height:4px;background:var(--y)}
.cab img{height:26px}.cab b{font:800 12pt Izmir,sans-serif;letter-spacing:-.01em}.cab span{margin-left:auto;font-size:8.5pt;color:var(--muted)}
h1{font:800 21pt/1.1 Izmir,sans-serif;letter-spacing:-.02em;margin:9mm 0 3mm}
.partes{margin:0 0 6mm;text-align:justify}
.ficha{border:1.3px solid var(--ink);border-radius:8px;margin:0 0 4mm;break-inside:avoid;overflow:hidden}
.ficha h2{margin:0;padding:6px 12px;font:700 8.5pt Izmir,sans-serif;text-transform:uppercase;letter-spacing:.07em;border-bottom:1.3px solid var(--ink);display:flex;align-items:center;gap:8px}
.ficha h2::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--y);box-shadow:0 0 0 1px var(--ink)}
.g{display:grid;grid-template-columns:1fr 1fr}
.c{padding:5px 12px 0;height:13.5mm;border-bottom:1px solid var(--hair);border-right:1px solid var(--hair)}
.g .c:nth-child(2n){border-right:0}.c.full{grid-column:1/3;border-right:0}
.c span{font:600 6.8pt Izmir,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.g3{display:grid;grid-template-columns:repeat(3,1fr)}.g3 .c{border-bottom:0}.g3 .c:last-child{border-right:0}
.blq{margin-top:5mm}
h3{margin:0 0 3px;font:800 11.5pt/1.2 Izmir,sans-serif;display:flex;gap:8px;align-items:center;break-after:avoid;letter-spacing:-.01em}
h3 .n{flex:none;width:20px;height:20px;border-radius:5px;background:var(--y);display:grid;place-items:center;font:800 9pt Izmir,sans-serif}
p{margin:0 0 6px;text-align:justify;hyphens:auto}
ul{margin:3px 0 7px;padding-left:17px}li{margin-bottom:3px;text-align:justify}
.ref{border-bottom:1px dotted var(--ink);white-space:nowrap}
.cierre{margin-top:6mm;break-inside:avoid}.blq:last-of-type{break-after:avoid}
.firmas{display:flex;gap:16mm;margin-top:20mm}
.firma{flex:1;font-size:8.8pt;text-align:center}.firma .lin{border-top:1.3px solid var(--ink);padding-top:5px}
.firma b{display:block;font:700 10pt Izmir,sans-serif}.firma small{color:var(--muted);display:block;line-height:1.4;margin-top:2px}
.acepto{display:flex;gap:9px;align-items:center;font-weight:600;margin-bottom:5mm}.acepto i{flex:none;width:13px;height:13px;border:1.4px solid var(--ink);border-radius:3px}.dos{margin-top:8mm;font-size:8.5pt;color:var(--muted);text-align:center}
.err{padding:30px;text-align:center}
@media print{body{background:#fff}.bar{display:none}.hoja{margin:0;padding:0;box-shadow:none;max-width:none}}
</style>
</head>
<body>
<div class="bar"><span>Contrato para firma física. Imprímelo en tamaño carta, por una sola cara.</span><button type="button" onclick="window.print()">Imprimir o guardar PDF</button></div>
<main class="hoja" id="hoja"><p class="err">Cargando contrato…</p></main>
<script>
(function () {
  'use strict';
  fetch('/contrato/').then(function (r) { return r.text(); }).then(function (s) {
    var a = s.indexOf('const contratoClausulas = ['), e = s.indexOf('];', a) + 2;
    var c0 = s.indexOf('const contratoConfig = ['), c1 = s.indexOf('];', c0) + 2;
    var src = s.slice(a, e).replace('const ', 'var ') + ';' + s.slice(c0, c1).replace('const ', 'var ') + ';return {cl: contratoClausulas, cfg: contratoConfig[0]};';
    var D = new Function(src)(), C = D.cfg;
    var ref = function (t) { return '<span class="ref">' + t + '</span>'; };
    var V = {
      nombre: ref('nombre y apellido'), ci: ref('C.I. o NIT'), negocio: ref('nombre del negocio'), direccion: ref('dirección de la sesión'),
      email: ref('correo electrónico'), whatsapp: ref('WhatsApp'), fecha: ref('fecha de la sesión'), servicio: ref('servicio'), paquete: ref('paquete'),
      detalle: ref('detalle'), precio: ref('precio total'), adelanto: ref('adelanto'), saldo: ref('saldo'), entrega: ref('plazo de entrega'), hoy: '____ / ____ / 20____',
      banco: C.banco, cuentaNumero: C.cuentaNumero, cuentaTitular: C.cuentaTitular, cuentaTipo: C.cuentaTipo, carnetTitular: C.carnetTitular,
      horarioAtencion: C.horarioAtencion, zonaNorte: C.zonaNorte, zonaSur: C.zonaSur, zonaEste: C.zonaEste, zonaOeste: C.zonaOeste,
      avisoReprogramar: C.avisoReprogramar, diasMora: C.diasMora
    };
    var ap = function (t) { return t.replace(/\{\{(\w+)\}\}/g, function (m, k) { return V[k] !== undefined ? V[k] : m; }); };
    var cel = function (t, cls) { return '<div class="c ' + (cls || '') + '"><span>' + t + '</span></div>'; };
    var ficha = '<div class="ficha"><h2>Ficha del cliente</h2><div class="g">' +
      cel('Nombre y apellido', 'full') + cel('C.I. o NIT') + cel('Nombre del negocio') + cel('Dirección de la sesión', 'full') +
      cel('Correo electrónico') + cel('WhatsApp') + cel('Fecha de la sesión') + cel('Servicio (sesión, plan o jornada)') + cel('Paquete') + cel('Detalle (fotos, horas y extras)') + '</div>' +
      '<div class="g3">' + cel('Precio total (Bs.)') + cel('Adelanto (Bs.)') + cel('Saldo (Bs.)') + '</div></div>';
    var bloques = D.cl.filter(function (x) { return !x.nota; }).map(function (x, i) {
      return '<section class="blq"><h3><span class="n">' + (i + 1) + '</span>' + x.titulo.replace(/^Bloque \d+\.\s*/, '') + '</h3>' +
        x.parrafos.map(function (t) { return '<p>' + ap(t) + '</p>'; }).join('') +
        (x.lista ? '<ul>' + x.lista.map(function (t) { return '<li>' + ap(t) + '</li>'; }).join('') + '</ul>' : '') + '</section>';
    }).join('');
    document.getElementById('hoja').innerHTML =
      '<div class="cab"><img src="/assets/logo-mark-black.png" alt=""><b>Estudio Graphica</b><span>Cochabamba, Bolivia</span></div>' +
      '<h1>Contrato de prestación de servicios</h1>' +
            ficha + bloques +
      '<div class="cierre"><p class="acepto"><i></i>Leí los ocho bloques y acepto el contrato completo.</p><p>En Cochabamba, a ____ de ______________ de 20____.</p>' +
      '<div class="firmas"><div class="firma"><div class="lin"><b>EL CLIENTE</b><small>Firma y aclaración</small></div></div>' +
      '<div class="firma"><div class="lin"><b>Pablo Villarroel Rocabado</b><small>EL FOTÓGRAFO · C.I. ' + C.carnetTitular + '</small></div></div></div>' +
      '<p class="dos">Dos ejemplares, uno para cada parte.</p></div>';
  }).catch(function () { document.getElementById('hoja').innerHTML = '<p class="err">No se pudo cargar el contrato. Recarga la página.</p>'; });
})();
</script>
</body>
</html>
