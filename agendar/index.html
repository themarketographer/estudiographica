<main class="ag">
  <h1>Elige tu horario</h1>
  <p>Reunión de 30 minutos con Estudio Graphica. Selecciona el día y la hora que te queden mejor.</p>
  <div id="cal-agendar"></div>
</main>

<script>

Cal('init', 'agendar', { origin: 'https://app.cal.com' });

var config = { layout: 'month_view', useSlotsViewOnSmallScreen: 'true', theme: 'light' };
try {
  var eventId = window.EG.prepareCalBooking('agendar', 'interesado_reunion');
  if (eventId) config['metadata[eventId]'] = eventId;
  config['metadata[origen]'] = window.EG.getOrigen();
  var fbp = window.EG.getFbp(), fbc = window.EG.getFbc();
  if (fbp) config['metadata[fbp]'] = fbp;
  if (fbc) config['metadata[fbc]'] = fbc;
} catch (e) {}
config['metadata[ua]'] = String(navigator.userAgent || '').slice(0, 450);
config['metadata[pagina]'] = (location.origin + location.pathname).slice(0, 450);

Cal.ns.agendar('inline', {
  elementOrSelector: '#cal-agendar',
  calLink: 'themarketographer/reunion',
  layout: 'month_view',
  config: config,
});
Cal.ns.agendar('ui', { theme: 'light', hideEventTypeDetails: false, layout: 'month_view' });
Cal.ns.agendar('on', {
  action: 'bookingSuccessfulV2',
  callback: function () {
    try {
      window.EG.trackEvent('Lead', {
        content_name: 'Reunión agendada',
        content_type: 'reunion',
        origen: window.EG.getOrigen(),
        event_id: window.EG.getLastEventId('agendar'),
      });
    } catch (e) {}
  },
});
</script>
