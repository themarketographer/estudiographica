<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sigue tu pedido | Magma Wings</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#260c0d">
<link rel="preload" href="../fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/magma.css">
<style>
.tk{max-width:520px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top,0px)) var(--gutter) 48px}
.tk-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s6)}
.tk-top img{width:120px;height:auto}
.tk-top a{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font:600 15px var(--body);text-decoration:none;min-height:44px}
.tk-top a .ic{width:18px;height:18px}
.tk h1{font:800 clamp(34px,9vw,48px)/1 var(--display);font-stretch:75%;letter-spacing:-.01em;margin:0 0 var(--s2)}
.tk .lead{color:var(--muted);margin:0 0 var(--s6)}
.tk-form{display:grid;gap:var(--s4)}
.tk-form .btn{width:100%}
.tk-card{border:1.5px solid var(--line);border-radius:20px;background:var(--surface);padding:var(--s5);margin-top:var(--s5)}
.tk-num{font:800 52px/1 var(--display);font-stretch:75%;color:var(--lava);letter-spacing:-.01em}
.tk-num small{font:700 15px var(--body);color:var(--muted);letter-spacing:.08em;margin-left:8px}
.tk-msg{font:700 20px/1.25 var(--body);margin:var(--s3) 0 var(--s1)}
.tk-sub{color:var(--muted);font-size:15.5px;margin:0}
.tk-steps{list-style:none;margin:var(--s5) 0 0;padding:0;display:grid;gap:0}
.tk-steps li{position:relative;display:flex;align-items:center;gap:var(--s3);padding:10px 0;color:var(--muted);font:600 16px var(--body)}
.tk-steps li + li::before{content:"";position:absolute;left:19px;top:-18px;height:28px;width:2px;background:var(--line)}
.tk-steps .dot{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:2px solid var(--line-strong);background:var(--ember-dark);position:relative;z-index:1}
.tk-steps .dot .ic{width:20px;height:20px}
.tk-steps li.on{color:var(--cream)}
.tk-steps li.on .dot{background:var(--lava);border-color:var(--lava);color:var(--ember-dark)}
.tk-steps li.on + li::before,.tk-steps li.on::before{background:var(--lava)}
.tk-steps li.cur .dot{box-shadow:0 0 0 0 rgba(244,148,12,.55);animation:tkp 1.8s ease-out infinite}
@keyframes tkp{to{box-shadow:0 0 0 14px rgba(244,148,12,0)}}
.tk-live{display:flex;align-items:center;gap:8px;color:var(--muted);font:500 14px var(--body);margin-top:var(--s4)}
.tk-live i{width:8px;height:8px;border-radius:50%;background:#8fe3a0}
.tk-err{color:var(--danger);font:600 15px/1.4 var(--body);margin:0}
.tk-actions{display:grid;gap:var(--s3);margin-top:var(--s5)}
.tk.cancel .tk-num{color:var(--danger)}
.tk-eta{display:flex;align-items:center;gap:8px;margin:var(--s4) 0 0;font:700 17px/1.3 var(--body)}
.tk-eta .ic{width:20px;height:20px;color:var(--lava)}
@media (prefers-reduced-motion:reduce){.tk-steps li.cur .dot{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
    <symbol id="i-up" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4m0 0L8 8m4-4l4 4M5 20h14"/></g></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.500c.8 3.200 5 5.300 5 10a5 5 0 0 1-10 0c0-1.900.9-3.300 2-4.400.2 1.300.9 2.100 1.900 2.500C10.500 7.800 11 5 12 2.500z"/></g></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6L5 8zM9 8V6a3 3 0 0 1 6 0v2"/></g></symbol>
    <symbol id="i-moto" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="17" r="2.800"/><circle cx="18.500" cy="17" r="2.800"/><path d="M8.800 17h6.900l-2.700-8H10M17 6.500h2.500l1 3.500"/></g></symbol>
    <symbol id="i-store" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.500l1.500-5h13l1.500 5"/><path d="M4 9.500a2.700 2.700 0 0 0 5.300 0 2.700 2.700 0 0 0 5.400 0 2.700 2.700 0 0 0 5.300 0"/><path d="M5.500 12.500v7h13v-7M10 19.500v-4.500h4v4.500"/></g></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.500"/><path d="M12 7.500V12l3 2"/></g></symbol>
    <symbol id="i-wa" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 0 0-7.800 13.500L3 21l4.600-1.200A9 9 0 1 0 12 3z"/><path d="M9 8.800c.3-.7.700-.8 1-.8l.7 1.700-.7 1c.6 1.200 1.600 2.100 2.800 2.600l1-.8 1.700.8c0 .6-.4 1.300-1 1.600-.7.300-1.800.2-3-.4-1.800-.9-3.200-2.400-3.800-3.900-.3-.8-.2-1.500.3-1.800z"/></g></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></g></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></g></symbol>
    <symbol id="i-receipt" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-2.500-1.600L13 21l-2.500-1.600L8 21l-2-1.300V3z"/><path d="M9 8h6M9 12h6"/></g></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></g></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6.500" y="2.500" width="11" height="19" rx="2.500"/><path d="M11 18.500h2"/></g></symbol>
</defs></svg>
<main class="tk" id="tk">
  <div class="tk-top"><img src="../images/logo-alpha.png" alt="Magma Wings" width="531" height="208"><a href="../"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg>Volver al menú</a></div>
  <h1 class="display">Sigue tu pedido</h1>
  <p class="lead">Escribe el número de tu pedido y los últimos 4 dígitos del celular con el que pediste.</p>
  <form class="tk-form" id="f" novalidate>
    <div class="f"><label for="n">Número de pedido</label><div class="inp"><input id="n" name="n" inputmode="text" autocapitalize="characters" autocomplete="off" placeholder="07-24OCT" maxlength="12"></div></div>
    <div class="f"><label for="p">Últimos 4 dígitos del celular</label><div class="inp"><input id="p" name="p" inputmode="numeric" autocomplete="off" placeholder="0828" maxlength="4"></div></div>
    <p class="tk-err" id="err" role="alert" hidden></p>
    <button class="btn" type="submit"><svg class="ic" aria-hidden="true"><use href="#i-clock"/></svg>Ver estado</button>
  </form>
  <section id="res" hidden aria-live="polite"></section>
</main>
<script src="../js/proof.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var STEPS = [['nuevo', 'Recibido', 'i-receipt'], ['preparando', 'En la freidora', 'i-flame'], ['listo', 'Listo', 'i-bag'], ['entregado', 'Entregado', 'i-check']];
  var MSG = {
    nuevo: ['Recibimos tu pedido', 'Lo estamos revisando. En cuanto lo confirmemos pasa a cocina.'],
    preparando: ['Tu pedido está en cocina', 'Se está friendo ahora mismo.'],
    listo: ['Tu pedido está listo', ''],
    entregado: ['Pedido entregado', 'Gracias por pedir en Magma Wings.'],
    cancelado: ['Este pedido se canceló', 'Si fue un error, escríbenos por WhatsApp y lo resolvemos.']
  };
  var cfg = { wa: '59176980828', prep: 20, zones: {}, qr: null };
  fetch('../menu.json').then(function (r) { return r.json(); }).then(function (m) {
    cfg.wa = m.brand.whatsapp; cfg.prep = m.service.prepMin || 20; cfg.qr = m.payment && m.payment.qr;
    (m.service.zones || []).forEach(function (z) { cfg.zones[z.id] = z.travelMin || 0; });
    if (cur) check(cur.n, cur.p, true);
  }).catch(function () {});
  var timer = null, cur = null;

  function svg(id) { var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('class', 'ic'); s.setAttribute('aria-hidden', 'true'); var u = document.createElementNS('http://www.w3.org/2000/svg', 'use'); u.setAttribute('href', '#' + id); s.appendChild(u); return s; }
  function el(t, c, x) { var n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; }
  function showErr(m) { var e = $('#err'); e.textContent = m || ''; e.hidden = !m; }

  function draw(d) {
    var box = $('#res'); box.textContent = ''; box.hidden = false;
    var cancel = d.status === 'cancelado';
    var card = el('div', 'tk-card' + (cancel ? ' cancel' : ''));
    var sp = /^#?(\d+)-(\w+)$/.exec(d.orderId) || [];
    var num = el('div', 'tk-num', '#' + (sp[1] || d.orderId)); num.appendChild(el('small', '', sp[2] || '')); card.appendChild(num);
    var m = MSG[d.status] || MSG.nuevo;
    var sub = d.status === 'listo' ? (d.mode === 'delivery' ? 'Sale en camino hacia ti.' : 'Ya puedes pasar a recogerlo al local.') : m[1];
    card.appendChild(el('p', 'tk-msg', (d.firstName ? d.firstName + ', ' : '') + m[0].charAt(0).toLowerCase() + m[0].slice(1)));
    card.appendChild(el('p', 'tk-sub', sub));
    if (!cancel) {
      var idx = STEPS.map(function (s) { return s[0]; }).indexOf(d.status);
      var ol = el('ol', 'tk-steps');
      STEPS.forEach(function (s, i) {
        var li = el('li', (i <= idx ? 'on' : '') + (i === idx ? ' cur' : ''));
        var dot = el('span', 'dot'); dot.appendChild(svg(i < idx ? 'i-check' : s[2])); li.appendChild(dot);
        li.appendChild(el('span', '', i === 2 && d.mode === 'delivery' ? 'En camino' : s[1])); ol.appendChild(li);
      });
      card.appendChild(ol);
    }
    if (d.status === 'nuevo' || d.status === 'preparando' || d.status === 'listo') {
      var total = cfg.prep + (d.mode === 'delivery' ? (cfg.zones[d.zone] || 0) : 0);
      var left = Math.round((new Date(d.createdAt).getTime() + total * 60000 - Date.now()) / 60000);
      var eta = el('p', 'tk-eta'); eta.appendChild(svg('i-clock'));
      eta.appendChild(document.createTextNode(d.status === 'listo' ? (d.mode === 'delivery' ? 'Tu pedido va en camino.' : 'Ya puedes pasar a recogerlo.') : left > 2 ? (d.mode === 'delivery' ? 'Llega en unos ' : 'Estará listo en unos ') + left + ' min' : 'Está por salir, gracias por esperar.'));
      card.appendChild(eta);
    }
    var live = el('div', 'tk-live'); live.appendChild(el('i')); live.appendChild(document.createTextNode(d.status === 'entregado' ? 'Pedido cerrado' : 'Se actualiza solo cada 15 segundos')); card.appendChild(live);
    var acts = el('div', 'tk-actions');
    var a = el('a', 'btn btn--wa'); a.href = 'https://wa.me/' + cfg.wa + '?text=' + encodeURIComponent('Hola, consulto por mi pedido ' + d.orderId); a.target = '_blank'; a.rel = 'noopener';
    a.appendChild(svg('i-wa')); a.appendChild(document.createTextNode('Escribir al local')); acts.appendChild(a); card.appendChild(acts);
    box.appendChild(card);
    if (d.payment && d.payment.method === 'qr' && !cancel && window.MagmaProof) {
      var pb = el('div'); box.appendChild(pb);
      window.MagmaProof.mount(pb, { n: d.orderId.replace(/^#/, ''), p: cur.p, amount: d.total, qr: cfg.qr, base: '../', status: d.payment.status, onStatus: function () { check(cur.n, cur.p, true); } });
    } else if (d.payment && d.payment.method !== 'qr' && !cancel && d.status !== 'entregado') {
      var cb = el('p', 'tk-sub', 'Pagas en efectivo al ' + (d.mode === 'delivery' ? 'recibir tu pedido.' : 'recoger tu pedido.')); cb.style.marginTop = '16px'; box.appendChild(cb);
    }
  }

  function check(n, p, quiet) {
    return fetch('/api/magma/track?n=' + encodeURIComponent(n) + '&p=' + encodeURIComponent(p), { cache: 'no-store' })
      .then(function (r) { return r.json().then(function (d) { return { st: r.status, d: d }; }); })
      .then(function (x) {
        if (!x.d.ok) { if (!quiet) showErr(x.d.error || 'No pudimos buscar el pedido.'); return; }
        showErr(''); cur = { n: n, p: p }; draw(x.d);
        $('#f').hidden = true; document.querySelector('.lead').hidden = true;
        clearInterval(timer);
        if (x.d.status !== 'entregado' && x.d.status !== 'cancelado') timer = setInterval(function () { if (!document.hidden) check(cur.n, cur.p, true); }, 15000);
      })
      .catch(function () { if (!quiet) showErr('Sin conexión. Intenta otra vez en un momento.'); });
  }

  $('#f').addEventListener('submit', function (e) {
    e.preventDefault();
    var n = $('#n').value.trim().replace(/^#/, ''), p = $('#p').value.replace(/\D/g, '');
    if (!/^\d{1,3}-\d{2}[A-Za-z]{3}$/.test(n)) return showErr('El número se ve así: 07-24OCT.');
    if (p.length !== 4) return showErr('Escribe los 4 últimos dígitos de tu celular.');
    showErr(''); check(n.toUpperCase(), p);
  });

  /* Si este mismo teléfono hizo el pedido, se abre solo con el último. */
  try {
    var last = JSON.parse(localStorage.getItem('magma.last.v2') || 'null');
    var qn = /[?&]n=([^&]+)/.exec(location.search); qn = qn ? decodeURIComponent(qn[1]).replace(/^#/, '').toUpperCase() : '';
    if (last && last.orderId && !/^#T/.test(last.orderId) && last.customer && last.customer.phone && (!qn || qn === last.orderId.replace(/^#/, ''))) {
      var n0 = last.orderId.replace(/^#/, ''), p0 = String(last.customer.phone).slice(-4);
      $('#n').value = n0; $('#p').value = p0; check(n0, p0, true);
    }
  } catch (e) {}
  var q = /[?&]n=([^&]+)/.exec(location.search); if (q) $('#n').value = decodeURIComponent(q[1]).replace(/^#/, '').toUpperCase();
})();
</script>
</body>
</html>
