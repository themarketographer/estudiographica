<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cocina · Zona 0</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#181818">
<link rel="icon" href="/favicon-32x32.png" sizes="32x32">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="/fonts/izmir-bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/base.css?v=20261030q">
<link rel="stylesheet" href="../css/brand.css?v=20261030q">

<body>
<header class="kbar">
  <a class="brandmark" href="./" aria-label="Cocina de Zona 0"><img class="bm-bean" src="../img/bean.svg" alt="" width="17" height="28"><span class="bm-name">Zona 0</span><em>Cocina</em></a>
  <span class="klive" id="live" hidden>En vivo</span>
  <div class="ktools" id="tools" hidden>
    <button class="ktool" id="selBtn" type="button" aria-pressed="false">Seleccionar varios</button>
    <button class="ktool" id="sound" type="button" aria-pressed="false">Sonido</button>
    <button class="ktool" id="logout" type="button">Salir</button>
  </div>
</header>

<form class="klogin" id="login">
  <h1>Cocina</h1>
  <p>Escribe la clave de cocina.</p>
  <input id="tk" type="password" autocomplete="current-password" placeholder="Clave de cocina" required aria-label="Clave de cocina">
  <button class="kbtn" type="submit">Entrar</button>
  <p class="kerr" id="err" hidden></p>
</form>

<main class="kmain" id="app" hidden>
  <section class="kcol" data-st="comida" aria-label="Comidas"><h2><span>Comidas</span><b class="num" data-n>0</b></h2><div class="kstack" data-active></div><details class="kdone"><summary>Listas <b class="num" data-dn>0</b></summary><div class="kstack" data-done></div></details></section>
  <section class="kcol" data-st="bebida" aria-label="Bebidas"><h2><span>Bebidas</span><b class="num" data-n>0</b></h2><div class="kstack" data-active></div><details class="kdone"><summary>Listas <b class="num" data-dn>0</b></summary><div class="kstack" data-done></div></details></section>
</main>
<div class="selbar" id="selbar" hidden><button class="ktool" id="selCancel" type="button">Cancelar</button><button class="kgo" id="selGo" type="button" disabled>Toca los productos</button></div>
<div class="ktoast" id="toast" role="status" aria-live="polite"></div>
<script src="../js/cocina.js?v=20261030q"></script>
</body>
</html>
