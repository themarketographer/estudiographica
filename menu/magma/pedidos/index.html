<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pedidos Magma Wings</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#260c0d">
<link rel="preload" href="../fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Bricolage Grotesque";src:url(../fonts/bricolage-grotesque.woff2) format("woff2");font-weight:600 800;font-stretch:75% 100%;font-display:swap}
@font-face{font-family:"Instrument Sans";src:url(../fonts/instrument-sans.woff2) format("woff2");font-weight:400 700;font-display:swap}
:root{--bg:#260c0d;--surface:#321113;--lava:#f4940c;--cream:#fdf0dc;--muted:#dcc7b3;--line:rgba(253,240,220,.2);--ok:#25d366;--danger:#ff9a8a;--display:"Bricolage Grotesque","Arial Narrow",sans-serif;--body:"Instrument Sans",system-ui,sans-serif;--ease:cubic-bezier(.16,1,.3,1);color-scheme:dark}
*{box-sizing:border-box;margin:0}
[hidden]{display:none !important}
body{background:var(--bg);color:var(--cream);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased;min-height:100dvh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cream);outline-offset:3px;border-radius:8px}
.wrap{max-width:900px;margin:0 auto;padding:24px 20px 80px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
header img{height:40px;width:auto;aspect-ratio:531/208}
h1{font:800 clamp(34px,6vw,48px)/1 var(--display);font-stretch:75%;letter-spacing:-.01em;color:var(--lava);margin-right:auto}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:2px solid var(--line);background:transparent;font-weight:600;transition:transform .2s var(--ease),background-color .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--lava);border-color:var(--lava);color:var(--bg)}
@media (hover:hover){.btn:hover{background:rgba(253,240,220,.1)}.btn.primary:hover{background:#ffb43a}}
.login{max-width:420px;margin:12vh auto 0;background:var(--surface);border:1.5px solid var(--line);border-radius:24px;padding:28px}
.login h2{font:800 34px/1 var(--display);font-stretch:75%;color:var(--lava);margin-bottom:8px}
.login p{color:var(--muted);margin-bottom:16px}
.login input{width:100%;min-height:52px;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:0 16px;margin-bottom:12px}
.login input:focus{outline:none;border-color:var(--lava);box-shadow:0 0 0 3px rgba(244,148,12,.28)}
.err{color:var(--danger);margin-top:12px;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px}
.stat b{display:block;font:800 34px/1 var(--display);font-stretch:75%;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-weight:500}
.chip[aria-pressed="true"]{background:var(--lava);border-color:var(--lava);color:var(--bg);font-weight:700}
.list{display:grid;gap:14px;list-style:none;padding:0}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:18px 20px;animation:rise .5s var(--ease) both}
.card.nuevo{border-color:var(--lava);box-shadow:0 0 0 3px rgba(244,148,12,.18)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.top .id{font:800 26px/1 var(--display);font-stretch:75%;letter-spacing:-.01em}
.top .when{color:var(--muted);font-size:14px;margin-right:auto}
.top .total{font:800 30px/1 var(--display);font-stretch:75%;color:var(--lava);font-variant-numeric:tabular-nums}
.who{margin:10px 0;font-weight:600}
.who small{display:block;font-weight:400;color:var(--muted)}
.items{margin:8px 0 12px;padding-left:18px;color:var(--cream)}
.items li{margin-bottom:4px}
.items small{color:var(--muted)}
.st{display:flex;gap:6px;flex-wrap:wrap}
.st button{min-height:38px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-size:14px;font-weight:600}
.st button[aria-pressed="true"]{background:var(--cream);border-color:var(--cream);color:var(--bg)}
.row2{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:48px 0}
.badge{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;background:var(--lava);color:var(--bg);font-size:12px;font-weight:700;vertical-align:middle}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="../images/logo-alpha.png" alt="Magma Wings" width="531" height="208">
    <h1>Pedidos</h1>
    <button class="btn" id="csv" type="button" hidden>Descargar CSV</button>
    <button class="btn primary" id="refresh" type="button" hidden>Actualizar</button>
    <button class="btn" id="logout" type="button" hidden>Salir</button>
  </header>

  <form class="login" id="login">
    <h2>Entrar</h2>
    <p>Escribe la clave de pedidos que guardaste en Netlify como <b>MAGMA_ADMIN_TOKEN</b>.</p>
    <label class="sr" for="tk" style="position:absolute;left:-9999px">Clave</label>
    <input id="tk" type="password" autocomplete="current-password" placeholder="Clave" required>
    <button class="btn primary" type="submit" style="width:100%">Ver pedidos</button>
    <p class="err" id="err" role="alert" hidden></p>
  </form>

  <section id="panel" hidden>
    <div class="stats" id="stats"></div>
    <div class="filters" id="filters" role="group" aria-label="Filtrar por estado"></div>
    <p class="small" id="store" style="color:var(--muted);font-size:13px;margin-bottom:12px"></p>
    <ul class="list" id="list"></ul>
  </section>
</div>

<script>
(function () {
  'use strict';
  var KEY = 'magma.admin.token';
  var STATUS = ['nuevo', 'preparando', 'listo', 'entregado', 'cancelado'];
  var LABEL = { nuevo: 'Nuevo', preparando: 'Preparando', listo: 'Listo', entregado: 'Entregado', cancelado: 'Cancelado' };
  var $ = function (s) { return document.querySelector(s); };
  var token = '', orders = [], filter = 'todos', timer = 0, pending = {};

  function get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function set(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function money(n) { return n + ' Bs'; }
  function ago(iso) {
    var s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return 'hace un momento';
    if (s < 3600) return 'hace ' + Math.floor(s / 60) + ' min';
    if (s < 86400) return 'hace ' + Math.floor(s / 3600) + ' h';
    return new Date(iso).toLocaleString('es-BO', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }
  function api(method, body) {
    return fetch('/api/magma/orders', { method: method, headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().then(function (d) { d.status = r.status; return d; }); });
  }

  function load(first) {
    return api('GET').then(function (d) {
      if (d.status === 401 || d.status === 503) throw new Error(d.error || 'No se pudo entrar.');
      if (!d.ok) throw new Error(d.error || 'Error al leer los pedidos.');
      orders = d.orders;
      /* Los cambios de estado tardan hasta ~1 min en verse desde cualquier lugar: mientras tanto se muestra el que acabas de poner. */
      orders.forEach(function (o) { var p = pending[o.key]; if (p && Date.now() - p.at < 90000) o.status = p.status; });
      $('#store').textContent = d.store === 'magma-orders' ? '' : 'Estás viendo pedidos de prueba (' + d.store + ').';
      var nuevos = orders.filter(function (o) { return o.status === 'nuevo'; }).length;
      document.title = (nuevos ? '(' + nuevos + ') ' : '') + 'Pedidos Magma Wings';
      render();
    });
  }

  function render() {
    var today = new Date().toDateString();
    var hoy = orders.filter(function (o) { return new Date(o.createdAt).toDateString() === today && o.status !== 'cancelado'; });
    var stats = $('#stats'); stats.textContent = '';
    [[orders.filter(function (o) { return o.status === 'nuevo'; }).length, 'por atender'], [hoy.length, 'pedidos hoy'], [money(hoy.reduce(function (s, o) { return s + o.total; }, 0)), 'vendido hoy']].forEach(function (x) {
      var s = el('div', 'stat'); s.appendChild(el('b', '', String(x[0]))); s.appendChild(el('span', '', x[1])); stats.appendChild(s);
    });
    var f = $('#filters'); f.textContent = '';
    ['todos'].concat(STATUS).forEach(function (st) {
      var n = st === 'todos' ? orders.length : orders.filter(function (o) { return o.status === st; }).length;
      var b = el('button', 'chip', (st === 'todos' ? 'Todos' : LABEL[st]) + ' ' + n);
      b.type = 'button'; b.setAttribute('aria-pressed', filter === st ? 'true' : 'false');
      b.addEventListener('click', function () { filter = st; render(); });
      f.appendChild(b);
    });
    var list = $('#list'); list.textContent = '';
    var shown = orders.filter(function (o) { return filter === 'todos' || o.status === filter; });
    if (!shown.length) { var e = el('li', 'empty', orders.length ? 'No hay pedidos con ese estado.' : 'Todavía no hay pedidos. Cuando alguien pida desde el menú, aparece aquí.'); list.appendChild(e); return; }
    shown.forEach(function (o, i) { list.appendChild(card(o, i)); });
  }

  function card(o, i) {
    var li = el('li', 'card ' + o.status); li.style.animationDelay = Math.min(i, 8) * 40 + 'ms';
    var top = el('div', 'top');
    var id = el('span', 'id', o.orderId);
    if (o.status === 'nuevo') id.appendChild(el('span', 'badge', 'Nuevo'));
    top.appendChild(id); top.appendChild(el('span', 'when', ago(o.createdAt))); top.appendChild(el('span', 'total', money(o.total)));
    li.appendChild(top);
    var who = el('p', 'who', o.customer.name + ' · ' + (o.mode === 'delivery' ? 'Entrega' : 'Recojo'));
    if (o.customer.address) who.appendChild(el('small', '', o.customer.address));
    if (o.customer.notes) who.appendChild(el('small', '', 'Notas: ' + o.customer.notes));
    li.appendChild(who);
    var ul = el('ul', 'items');
    o.lines.forEach(function (l) {
      var it = el('li', '', l.qty + 'x ' + l.name + ' ' + l.portion + ' · ' + money(l.total));
      var d = (l.choices || []).map(function (c) { return c.label + ': ' + c.options.map(function (x) { return x.name; }).join(', '); });
      if (l.note) d.push('Nota: ' + l.note);
      if (d.length) { it.appendChild(document.createElement('br')); it.appendChild(el('small', '', d.join(' · '))); }
      ul.appendChild(it);
    });
    li.appendChild(ul);
    var st = el('div', 'st'); st.setAttribute('role', 'group'); st.setAttribute('aria-label', 'Estado de ' + o.orderId);
    STATUS.forEach(function (s) {
      var b = el('button', '', LABEL[s]); b.type = 'button'; b.setAttribute('aria-pressed', o.status === s ? 'true' : 'false');
      b.addEventListener('click', function () {
        var prev = o.status; o.status = s; pending[o.key] = { status: s, at: Date.now() }; render();
        api('POST', { key: o.key, status: s }).then(function (d) { if (!d.ok) throw new Error(d.error); }).catch(function (e) { delete pending[o.key]; o.status = prev; render(); alert('No se pudo cambiar el estado: ' + e.message); });
      });
      st.appendChild(b);
    });
    li.appendChild(st);
    var row = el('div', 'row2');
    var cp = el('button', 'btn', 'Copiar pedido'); cp.type = 'button';
    cp.addEventListener('click', function () { (navigator.clipboard ? navigator.clipboard.writeText(o.message) : Promise.reject()).then(function () { cp.textContent = 'Copiado'; setTimeout(function () { cp.textContent = 'Copiar pedido'; }, 1500); }, function () { cp.textContent = 'No se pudo copiar'; }); });
    row.appendChild(cp); li.appendChild(row);
    return li;
  }

  function csv() {
    var q = function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
    var rows = [['Pedido', 'Fecha', 'Estado', 'Cliente', 'Tipo', 'Dirección', 'Notas', 'Productos', 'Total (Bs)']];
    orders.forEach(function (o) {
      rows.push([o.orderId, o.createdAt, o.status, o.customer.name, o.mode === 'delivery' ? 'Entrega' : 'Recojo', o.customer.address, o.customer.notes,
        o.lines.map(function (l) { return l.qty + 'x ' + l.name + ' ' + l.portion; }).join(' | '), o.total]);
    });
    var blob = new Blob(['﻿' + rows.map(function (r) { return r.map(q).join(','); }).join('\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'pedidos-magma.csv'; a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  function enter() {
    $('#login').hidden = true; $('#panel').hidden = false;
    ['#csv', '#refresh', '#logout'].forEach(function (s) { $(s).hidden = false; });
    clearInterval(timer); timer = setInterval(function () { if (!document.hidden) load().catch(function () {}); }, 30000);
  }
  function leave(msg) {
    token = ''; set(KEY, ''); clearInterval(timer);
    $('#login').hidden = false; $('#panel').hidden = true;
    ['#csv', '#refresh', '#logout'].forEach(function (s) { $(s).hidden = true; });
    var e = $('#err'); e.textContent = msg || ''; e.hidden = !msg;
  }

  $('#login').addEventListener('submit', function (ev) {
    ev.preventDefault();
    token = $('#tk').value.trim();
    load(true).then(function () { set(KEY, token); enter(); }).catch(function (e) { leave(e.message); });
  });
  $('#refresh').addEventListener('click', function () { load().catch(function (e) { leave(e.message); }); });
  $('#logout').addEventListener('click', function () { leave(''); });
  $('#csv').addEventListener('click', csv);

  token = get(KEY);
  if (token) load(true).then(enter).catch(function (e) { leave(e.message); });
})();
</script>
</body>
</html>
