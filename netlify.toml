[build]
functions = "netlify/functions"

[functions]
node_bundler = "esbuild"

# Monitoreo de caidas: corre netlify/functions/uptime-check.js sola cada 15
# minutos y avisa por ntfy.sh si el sitio no responde. Ver el comentario
# dentro de ese archivo para saber como recibir el aviso en el celular.
[functions."uptime-check"]
  schedule = "*/15 * * * *"

# Las fuentes (Izmir) las usa tambien el panel del CMS, que vive en otro
# dominio. Sin esta cabecera el navegador bloquea la carga entre dominios.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

# Menu de Magma Wings: API publica del menu y recepcion de pedidos.
# Ver menu/magma/README.md.
[[redirects]]
  from = "/api/magma/menu"
  to = "/.netlify/functions/magma-menu"
  status = 200

[[redirects]]
  from = "/api/magma/order"
  to = "/.netlify/functions/magma-order"
  status = 200

[[redirects]]
  from = "/api/magma/orders"
  to = "/.netlify/functions/magma-orders"
  status = 200

[[redirects]]
  from = "/api/magma/proof"
  to = "/.netlify/functions/magma-proof"
  status = 200

[[redirects]]
  from = "/api/magma/track"
  to = "/.netlify/functions/magma-track"
  status = 200

# Respaldo semanal de pedidos por correo (lunes 8:00 hora de Bolivia). Necesita MAGMA_BACKUP_EMAIL.
[functions."magma-backup"]
  schedule = "0 12 * * 1"

[[headers]]
  for = "/menu/magma/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Menu de Magma: caché para soportar mucho tráfico sin gastar créditos. Las fotos y las fuentes casi no cambian;
# el código y los datos se refrescan en minutos. Ver menu/magma/README.md, sección "Créditos de Netlify".
[[headers]]
  for = "/menu/magma/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/menu/magma/js/*"
  [headers.values]
    Cache-Control = "public, max-age=600"

[[headers]]
  for = "/menu/magma/css/*"
  [headers.values]
    Cache-Control = "public, max-age=600"

[[headers]]
  for = "/menu/magma/menu.json"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=300"

# Zona 0 (cafetería para ciclistas): pedidos desde el celular y panel del local. Ver menu/zona-0/README.md.
[[redirects]]
  from = "/api/zona0/order"
  to = "/.netlify/functions/zona0-order"
  status = 200

[[redirects]]
  from = "/api/zona0/orders"
  to = "/.netlify/functions/zona0-orders"
  status = 200

[[redirects]]
  from = "/api/zona0/track"
  to = "/.netlify/functions/zona0-track"
  status = 200

[[redirects]]
  from = "/api/zona0/kitchen"
  to = "/.netlify/functions/zona0-kitchen"
  status = 200

[[redirects]]
  from = "/api/zona0/ledger"
  to = "/.netlify/functions/zona0-ledger"
  status = 200

[[redirects]]
  from = "/api/zona0/import"
  to = "/.netlify/functions/zona0-import"
  status = 200

[[headers]]
  for = "/menu/zona-0/js/*"
  [headers.values]
    Cache-Control = "public, max-age=600"

[[headers]]
  for = "/menu/zona-0/css/*"
  [headers.values]
    Cache-Control = "public, max-age=600"

[[headers]]
  for = "/menu/zona-0/menu.json"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=300"
