[build]
functions = "netlify/functions"

[functions]
node_bundler = "esbuild"

# Monitoreo de caidas: corre netlify/functions/uptime-check.js sola cada 15
# minutos y avisa por ntfy.sh si el sitio no responde. Ver el comentario
# dentro de ese archivo para saber como recibir el aviso en el celular.
[functions."uptime-check"]
  schedule = "*/15 * * * *"

# Las fuentes (Izmir) las usa tambien el panel del CMS, que vive en otro
# dominio. Sin esta cabecera el navegador bloquea la carga entre dominios.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

# Menu de Magma Wings: API publica del menu y recepcion de pedidos.
# Ver menu/magma/README.md.
[[redirects]]
  from = "/api/magma/menu"
  to = "/.netlify/functions/magma-menu"
  status = 200

[[redirects]]
  from = "/api/magma/order"
  to = "/.netlify/functions/magma-order"
  status = 200

[[redirects]]
  from = "/api/magma/orders"
  to = "/.netlify/functions/magma-orders"
  status = 200

[[redirects]]
  from = "/api/magma/track"
  to = "/.netlify/functions/magma-track"
  status = 200

# Respaldo semanal de pedidos por correo (lunes 8:00 hora de Bolivia). Necesita MAGMA_BACKUP_EMAIL.
[functions."magma-backup"]
  schedule = "0 12 * * 1"

[[headers]]
  for = "/menu/magma/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
