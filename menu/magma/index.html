<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Menú Magma Wings</title>
<meta name="description" content="Menú de Magma Wings en Cochabamba: alitas, pollo frito, papas y salsas. Arma tu pedido y envíalo por WhatsApp.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#260c0d">
<link rel="preload" href="fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/magma.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8zM9 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-wa" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3z" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"/><path d="M8.8 8.6c.3-.6.6-.6.9-.6l.6.1.9 2-.7 1c.6 1.2 1.6 2.1 2.8 2.7l1-.8 1.9.9c0 .4-.1 1.1-.7 1.5-.6.5-1.5.5-2.6 0-2.4-1-4.2-2.8-4.9-4.6-.3-.8-.3-1.600.8-2.200z" fill="currentColor"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M16 8V6.5A2.500 2.500 0 0 0 13.500 4h-7A2.500 2.500 0 0 0 4 6.500v7A2.500 2.500 0 0 0 6.500 16H8" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
  </defs>
</svg>

<nav class="nav" id="nav" aria-label="Menú">
  <a class="brand" href="#top" aria-label="Magma Wings, ir al inicio"><img src="images/logo-alpha.png" alt="Magma Wings" width="531" height="208"></a>
  <div class="nav-links" role="tablist" aria-label="Categorías">
    <a href="#alitas">Alitas</a>
    <a href="#pollo">Pollo frito</a>
  </div>
  <button class="nav-cart" id="navCart" type="button" aria-label="Ver pedido"><svg class="ic" aria-hidden="true"><use href="#i-bag"/></svg><b id="navCount" hidden>0</b></button>
</nav>

<header class="intro grain" id="top" data-spot data-tone="dark">
  <span class="orb orb-a" aria-hidden="true"></span>
  <span class="spot" aria-hidden="true"></span>
  <div class="embers" aria-hidden="true"></div>
  <div class="wrap intro-grid">
    <div class="intro-copy">
      <h1 data-words id="tagline">Nuestro <span class="mark">menú</span></h1>
      <p class="lead rv" style="--d:250ms">Elige tu porción y tu salsa. El pedido se envía por WhatsApp.</p>
      <p class="status rv" id="status" style="--d:350ms" hidden></p>
    </div>
    <div class="intro-logo" aria-hidden="true"><span class="glow"></span><img src="images/logo-alpha.png" alt="" width="531" height="208"></div>
  </div>
</header>

<div class="ticker" id="ticker" aria-label="Salsas disponibles"><div class="ticker-track" id="tickerTrack"></div></div>

<main id="menu" aria-busy="true"><p class="boot">Cargando el menú…</p></main>

<footer class="foot grain">
  <div class="embers" aria-hidden="true"></div>
  <div class="wrap foot-in">
    <div class="foot-brand rv"><span class="glow" aria-hidden="true"></span><img src="images/logo-alpha.png" alt="Magma Wings" width="531" height="208"></div>
    <p class="foot-tag rv">Aplasta tus límites</p>
    <p class="foot-help">¿Dudas con tu pedido? Escríbenos al <a id="wa" href="#" rel="noopener"></a>.</p>
    <p class="foot-meta"><svg class="ic" aria-hidden="true"><use href="#i-pin"/></svg><a id="addr" href="#" rel="noopener" target="_blank"></a></p>
    <p class="foot-meta" id="hoursRow" hidden><span id="hours"></span></p>
    <p class="draft" id="draft" hidden></p>
  </div>
</footer>

<button class="dock" id="cartBar" type="button" inert aria-label="Ver pedido">
  <span class="dock-bag"><svg class="ic" aria-hidden="true"><use href="#i-bag"/></svg><b id="cartCount">0</b></span>
  <span class="dock-label">Ver pedido</span>
  <span class="dock-total" id="cartTotal">0 Bs</span>
</button>
<div class="fly" id="fly" popover="manual" aria-hidden="true"></div>
<p class="sr" id="cartStatus" role="status" aria-live="polite"></p>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<dialog class="sheet" id="itemDlg" aria-labelledby="itemTitle">
  <div class="sheet-head" data-grab>
    <span class="grab" aria-hidden="true"></span>
    <div class="sheet-title-row">
      <h2 id="itemTitle"></h2>
      <button class="icon-btn" type="button" data-close aria-label="Cerrar"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
  </div>
  <div class="sheet-body" id="itemBody"></div>
  <div class="sheet-foot" id="itemFoot"></div>
</dialog>

<dialog class="sheet side" id="cartDlg" aria-labelledby="cartTitle">
  <div class="sheet-head" data-grab>
    <span class="grab" aria-hidden="true"></span>
    <div class="sheet-title-row">
      <button class="icon-btn" type="button" id="cartBack" aria-label="Volver al pedido" hidden><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg></button>
      <h2 id="cartTitle">Tu pedido</h2>
      <button class="icon-btn" type="button" data-close aria-label="Cerrar"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
  </div>
  <ol class="steps" id="cartSteps" aria-label="Pasos del pedido"></ol>
  <div class="sheet-body" id="cartBody"></div>
  <div class="sheet-foot" id="cartFoot"></div>
</dialog>

<noscript><p class="boot">Este menú necesita JavaScript. Escríbenos por WhatsApp al +591 76980828 y te atendemos.</p></noscript>

<script src="js/pricing.js"></script>
<script src="js/motion.js"></script>
<script src="js/app.js"></script>
</body>
</html>
