<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#FFDD5A" />
<title>Firma con tu celular · Estudio Graphica</title>
<link rel="stylesheet" href="/assets/css/eg-ui.css" />
<style>
html,body{height:100%;margin:0;overscroll-behavior:none}
body{display:flex;flex-direction:column;background:var(--paper,#f8f8f8);color:var(--ink,#181818);font-family:var(--f,system-ui,sans-serif);padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));gap:14px;touch-action:none}
h1{font-size:22px;line-height:1.15;margin:0;letter-spacing:-.02em}
p{margin:0;font-size:14.5px;line-height:1.45;color:var(--muted,#666)}
.pad{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
.caja{position:relative;width:100%;background:#fff;border:1px solid var(--hair,#e6e6e6);border-radius:22px;box-shadow:0 20px 40px -28px rgba(24,24,24,.4);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.linea{position:absolute;left:6%;right:6%;bottom:22%;border-bottom:1.5px solid rgba(24,24,24,.2);pointer-events:none}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(24,24,24,.4);font-size:15px;pointer-events:none;transition:opacity .2s}
.ph.off{opacity:0}
.btns{display:flex;gap:10px}
button{font:600 16px/1 var(--f,system-ui);min-height:54px;border-radius:999px;border:0;cursor:pointer;transition:transform .14s cubic-bezier(.23,1,.32,1),opacity .2s}
button:active{transform:scale(.97)}
#borrar{flex:0 0 auto;padding:0 22px;background:#fff;border:1px solid var(--hair,#e6e6e6);color:var(--ink,#181818)}
#enviar{flex:1;background:var(--ink,#181818);color:var(--y,#ffdd5a)}
#enviar:disabled{opacity:.35}
.fin{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.fin h1{font-size:26px}
.fin svg{width:64px;height:64px;border-radius:50%;background:var(--y,#ffdd5a);padding:16px;box-sizing:border-box}
body.listo .pad,body.listo .btns,body.listo .cab{display:none}
body.listo .fin{display:flex}
#err{color:var(--err,#b3261e);font-size:14px;min-height:18px}
@media(prefers-reduced-motion:reduce){button:active{transform:none}}
</style>
</head>
<body>
<div class="cab"><h1>Firma con el dedo</h1><p>Gira el celular de lado si necesitas más espacio. Tu firma aparece sola en la computadora.</p></div>
<div class="pad"><div class="caja" id="caja"><canvas id="c"></canvas><div class="linea"></div><div class="ph" id="ph">Firma aquí</div></div></div>
<div id="err" role="alert"></div>
<div class="btns"><button type="button" id="borrar">Borrar</button><button type="button" id="enviar" disabled>Enviar firma</button></div>
<div class="fin"><svg viewBox="0 0 24 24" fill="none" stroke="#181818" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><h1>Listo, firma enviada</h1><p>Ya puedes volver a la computadora. Puedes cerrar esta pestaña.</p></div>
<script>
(function(){
  var t=(new URLSearchParams(location.search).get('t')||'');
  var caja=document.getElementById('caja'),cv=document.getElementById('c'),ctx=cv.getContext('2d');
  var ph=document.getElementById('ph'),err=document.getElementById('err'),env=document.getElementById('enviar');
  var ratio=2.6,trazos=[],actual=null;
  function medir(){
    var pad=caja.parentNode.getBoundingClientRect();
    var w=pad.width,h=w/ratio;
    if(h>pad.height){h=pad.height;w=h*ratio}
    caja.style.width=w+'px';caja.style.height=h+'px';
    var d=window.devicePixelRatio||1;
    cv.width=Math.round(w*d);cv.height=Math.round(h*d);
    ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#181818';
    pintar();
  }
  function pintar(){
    var r=caja.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);
    trazos.forEach(function(tr){
      if(tr.length===1){ctx.beginPath();ctx.arc(tr[0].x*r.width,tr[0].y*r.height,1.2,0,7);ctx.fillStyle='#181818';ctx.fill();return}
      ctx.beginPath();ctx.moveTo(tr[0].x*r.width,tr[0].y*r.height);
      for(var i=1;i<tr.length;i++)ctx.lineTo(tr[i].x*r.width,tr[i].y*r.height);ctx.stroke();
    });
    ph.classList.toggle('off',trazos.length>0);env.disabled=trazos.length===0;
  }
  function pos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
  cv.addEventListener('pointerdown',function(e){e.preventDefault();cv.setPointerCapture(e.pointerId);actual=[pos(e)];trazos.push(actual);pintar()});
  cv.addEventListener('pointermove',function(e){if(!actual)return;e.preventDefault();actual.push(pos(e));pintar()});
  function fin(){actual=null}
  cv.addEventListener('pointerup',fin);cv.addEventListener('pointercancel',fin);
  document.getElementById('borrar').addEventListener('click',function(){trazos=[];pintar()});
  env.addEventListener('click',function(){
    env.disabled=true;err.textContent='';
    fetch('/.netlify/functions/firma-remota',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accion:'enviar',t:t,trazos:trazos})})
      .then(function(r){if(r.ok){document.body.classList.add('listo');return}
        err.textContent=r.status===410?'Este código venció. Vuelve a escanear el QR en la computadora.':r.status===409?'Esta firma ya se envió.':'No se pudo enviar. Inténtalo de nuevo.';env.disabled=false})
      .catch(function(){err.textContent='Sin conexión. Inténtalo de nuevo.';env.disabled=false});
  });
  fetch('/.netlify/functions/firma-remota?t='+encodeURIComponent(t),{cache:'no-store'}).then(function(r){return r.json()}).then(function(s){
    if(s.estado==='vencido'||!s.estado){err.textContent='Este código venció. Vuelve a escanear el QR en la computadora.';env.disabled=true;return}
    if(s.ratio)ratio=s.ratio;medir();
  }).catch(function(){medir()});
  medir();window.addEventListener('resize',medir);
})();
</script>
</body>
</html>
