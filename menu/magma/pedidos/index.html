<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pedidos Magma Wings</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#260c0d">
<link rel="preload" href="../fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Bricolage Grotesque";src:url(../fonts/bricolage-grotesque.woff2) format("woff2");font-weight:600 800;font-stretch:75% 100%;font-display:swap}
@font-face{font-family:"Instrument Sans";src:url(../fonts/instrument-sans.woff2) format("woff2");font-weight:400 700;font-display:swap}
:root{
  --bg:#260c0d;--surface:#321113;--surface-2:#3e1719;--lava:#f4940c;--cream:#fdf0dc;--muted:#e3d0bd;--line:rgba(253,240,220,.16);--line-2:rgba(253,240,220,.4);
  --nuevo:#f4940c;--preparando:#ffd23f;--listo:#25d366;--entregado:#a9bdb2;--cancelado:#ff8a7a;--danger:#ff9a8a;
  --display:"Bricolage Grotesque","Arial Narrow",sans-serif;--body:"Instrument Sans",system-ui,sans-serif;--ease:cubic-bezier(.16,1,.3,1);--out:cubic-bezier(.23,1,.32,1);
  color-scheme:dark}
*{box-sizing:border-box;margin:0}
[hidden]{display:none !important}
body{background:radial-gradient(900px 500px at 85% -10%,rgba(244,148,12,.12),transparent 60%),var(--bg);color:var(--cream);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased;min-height:100dvh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--cream);outline-offset:3px;border-radius:10px}
.ic{width:22px;height:22px;flex:none}
.wrap{max-width:1160px;margin:0 auto;padding:20px 20px 120px}
.display{font-family:var(--display);font-weight:800;font-stretch:75%;letter-spacing:-.01em;font-variant-numeric:tabular-nums lining-nums}

/* Barra superior */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.bar img{height:40px;width:auto;aspect-ratio:531/208}
.bar h1{font-size:clamp(34px,5vw,46px);line-height:1;color:var(--lava)}
.live{display:inline-flex;align-items:center;gap:8px;margin-right:auto;margin-left:6px;color:var(--muted);font-size:14px}
.live::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--listo);box-shadow:0 0 0 0 rgba(37,211,102,.6);animation:ping 2s infinite}
.live.off::before{background:var(--danger);animation:none}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
.tool{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:14.5px;line-height:1;transition:transform .2s var(--out),background-color .2s,border-color .2s}
.tool:active{transform:scale(.95)}
.tool[aria-pressed="true"]{background:var(--cream);color:var(--bg);border-color:var(--cream)}
.tool[aria-pressed="true"] .ic{animation:ring .7s var(--ease)}
@keyframes ring{20%{rotate:-18deg}40%{rotate:14deg}60%{rotate:-8deg}100%{rotate:0deg}}
@media (hover:hover){.tool:hover{border-color:var(--line-2)}}
@media (max-width:620px){.tool span{display:none}.tool{padding:0 14px}.bar{gap:8px}.live{order:5;flex-basis:100%;margin:0}}

/* Entrar */
.login{max-width:430px;margin:12vh auto 0;background:var(--surface);border:1.5px solid var(--line);border-radius:26px;padding:30px;text-align:center;animation:rise .6s var(--ease) both}
.login .lock{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:rgba(244,148,12,.15);color:var(--lava)}
.login .lock .ic{width:30px;height:30px}
.login h2{font-size:38px;line-height:1;color:var(--lava);margin-bottom:8px}
.login p{color:var(--muted);margin-bottom:18px}
.login input{width:100%;min-height:54px;background:var(--bg);border:1.5px solid var(--line-2);border-radius:14px;padding:0 16px;margin-bottom:12px;font-size:17px}
.login input:focus{outline:none;border-color:var(--lava);box-shadow:0 0 0 3px rgba(244,148,12,.28)}
.err{color:var(--danger);margin-top:12px;font-weight:500}
.primary{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;border-radius:16px;background:var(--lava);color:var(--bg);font-weight:700;font-size:17px;line-height:1;transition:transform .2s var(--out),background-color .2s,box-shadow .2s;box-shadow:0 8px 22px -10px rgba(0,0,0,.6)}
.primary:active{transform:scale(.98)}
@media (hover:hover){.primary:hover{filter:brightness(1.08)}}

/* Resumen */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi{position:relative;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1.5px solid var(--line);border-radius:20px;padding:14px 16px;animation:rise .5s var(--ease) both}
.kpi .kic{grid-row:1/3;display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:rgba(253,240,220,.08);color:var(--lava)}
.kpi b{font-size:28px;line-height:1}
.kpi span{color:var(--muted);font-size:13.5px;line-height:1.3}
.kpi.alert{border-color:var(--nuevo);background:linear-gradient(160deg,rgba(244,148,12,.28),var(--surface))}
.kpi.alert .kic{background:var(--lava);color:var(--bg);animation:ring 2.4s var(--ease) infinite}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi b{font-size:28px}}

/* Pestañas y búsqueda */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 14px 0 13px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:15px;line-height:1;transition:background-color .2s,border-color .2s,color .2s,transform .2s var(--out)}
.tab .ic{width:20px;height:20px}
.tab:active{transform:scale(.96)}
.tab i{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:rgba(253,240,220,.14);font:700 13px/1 var(--body);font-style:normal;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--cream);border-color:var(--cream);color:var(--bg)}
.tab[aria-selected="true"] i{background:rgba(38,12,13,.14)}
.tab.has i{background:var(--nuevo);color:var(--bg)}
.search{position:relative;margin-bottom:18px}
.search .ic{position:absolute;left:16px;top:50%;translate:0 -50%;color:var(--muted);pointer-events:none}
.search input{width:100%;min-height:50px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:0 16px 0 48px;font-size:16px}
.search input:focus{outline:none;border-color:var(--lava);box-shadow:0 0 0 3px rgba(244,148,12,.2)}

/* Pedidos */
.grid{display:grid;gap:16px;list-style:none;padding:0;grid-template-columns:1fr}
@media (min-width:880px){.grid{grid-template-columns:1fr 1fr;align-items:start}}
.card{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:26px;padding:18px 20px 20px;display:grid;gap:14px;animation:rise .55s var(--ease) both;transition:opacity .2s ease,transform .22s var(--out)}
.card.leaving{opacity:0;transform:translateY(-10px) scale(.97)}
.card[data-s="nuevo"]{border-color:var(--nuevo);background:linear-gradient(180deg,rgba(244,148,12,.14),var(--surface) 38%)}
.card[data-s="nuevo"].fresh{animation:rise .55s var(--ease) both,flash 1.6s ease-out .3s 2}
@keyframes flash{50%{box-shadow:0 0 0 6px rgba(244,148,12,.35)}}
.card[data-s="preparando"]{border-color:rgba(255,210,63,.75)}
.card[data-s="listo"]{border-color:rgba(37,211,102,.75)}
.card[data-s="entregado"],.card[data-s="cancelado"]{opacity:.85}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.head{display:flex;align-items:center;gap:14px}
.num{display:grid;place-items:center;width:62px;height:62px;border-radius:18px;background:var(--lava);color:var(--bg);text-align:center;line-height:1;flex:none}
.num b{font-size:28px}
.num small{display:block;font:700 11px/1 var(--body);letter-spacing:.06em;margin-top:3px;opacity:.8}
.card[data-s="preparando"] .num{background:var(--preparando)}
.card[data-s="listo"] .num{background:var(--listo)}
.card[data-s="entregado"] .num{background:var(--entregado)}
.card[data-s="cancelado"] .num{background:var(--cancelado)}
.hmain{min-width:0;flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 11px 0 8px;border-radius:999px;font:700 13.5px/1 var(--body);background:rgba(253,240,220,.12)}
.pill .ic{width:17px;height:17px}
.pill[data-s="nuevo"]{color:var(--nuevo)}.pill[data-s="preparando"]{color:var(--preparando)}.pill[data-s="listo"]{color:var(--listo)}.pill[data-s="entregado"]{color:var(--entregado)}.pill[data-s="cancelado"]{color:var(--cancelado)}
.when{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;line-height:1.2;margin-top:7px}
.when .ic{width:17px;height:17px}
.when.warn{color:var(--preparando);font-weight:700}.when.late{color:var(--danger);font-weight:700}
.total{font-size:34px;line-height:1;color:var(--lava);text-align:right}
.total small{display:block;font:500 13px var(--body);color:var(--muted);margin-top:4px}

/* Avance del pedido */
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;list-style:none;padding:0}
.flow li{display:grid;justify-items:center;gap:6px;font-size:12.5px;line-height:1.2;color:var(--muted);position:relative}
.flow li::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:3px;border-radius:2px;background:var(--line)}
.flow li:first-child::before{display:none}
.flow li.on::before{background:var(--lava);animation:grow .6s var(--ease) both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}}
.flow .dot{position:relative;z-index:1;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2)}
.flow .dot .ic{width:16px;height:16px}
.flow li.on .dot{background:var(--lava);border-color:var(--lava);color:var(--bg)}
.flow li.cur .dot{background:var(--cream);border-color:var(--cream);color:var(--bg);box-shadow:0 0 0 5px rgba(253,240,220,.16)}
.flow li.cur{color:var(--cream);font-weight:700}

/* Cliente */
.who{display:flex;gap:14px;align-items:flex-start}
.avatar{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:rgba(253,240,220,.12);font:800 19px/1 var(--display);font-stretch:75%;flex:none}
.wname{font-weight:700;font-size:18px;line-height:1.25;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.how{display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:1.2;font-weight:700;padding:4px 10px 4px 8px;border-radius:10px;background:rgba(253,240,220,.12)}
.how .ic{width:17px;height:17px;color:var(--lava)}
.meta{display:grid;gap:5px;margin-top:8px;color:var(--muted);font-size:15px;line-height:1.4}
.meta div{display:flex;gap:8px;align-items:flex-start}
.meta .ic{width:17px;height:17px;margin-top:2px;color:var(--lava)}
.items{list-style:none;padding:0;display:grid;gap:10px}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:4px 12px;align-items:center;padding:12px;border-radius:16px;background:var(--surface-2)}
.item .iico{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:rgba(244,148,12,.16);color:var(--lava)}
.item .iname{font-weight:700;font-size:16.5px;line-height:1.25}
.item .iname span{display:block;font-weight:500;font-size:14px;color:var(--muted)}
.item .iamt{font-weight:700;font-size:15.5px;font-variant-numeric:tabular-nums}
.tags{grid-column:2/-1;list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.tags li{display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 9px;border-radius:999px;background:rgba(253,240,220,.1);font-size:14px;line-height:1.2;font-weight:600}
.tags .ic{width:15px;height:15px;color:var(--lava)}
.tags li.note{background:rgba(255,210,63,.15);color:#ffe9a0}
.callout{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:rgba(255,210,63,.13);color:#ffe9a0;font-size:15px;line-height:1.4}
.callout .ic{width:19px;height:19px;margin-top:0}
.callout .ic{color:#ffd23f;margin-top:1px}

/* Acciones */
.acts{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);font-weight:600;font-size:15px;line-height:1;text-decoration:none;transition:transform .2s var(--out),background-color .2s,border-color .2s}
.chipbtn:active{transform:scale(.95)}
.chipbtn .ic{width:20px;height:20px}
.chipbtn.wa{border-color:rgba(37,211,102,.65);color:#7ff0ad;background:rgba(37,211,102,.08)}
@media (hover:hover){.chipbtn:hover{background:rgba(253,240,220,.08)}.chipbtn.wa:hover{background:rgba(37,211,102,.18)}}
.next{margin-top:2px}
.next[data-s="preparando"]{background:var(--preparando)}.next[data-s="listo"]{background:var(--listo)}
.next .ic{width:24px;height:24px}
.sec{display:flex;gap:16px;align-items:center;justify-content:space-between}
.link{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 4px;font-weight:600;font-size:14.5px;line-height:1;color:var(--muted);text-decoration:underline;text-underline-offset:4px}
.link .ic{width:18px;height:18px}
.link.danger{color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:60px 12px;grid-column:1/-1}
.empty .eico{display:grid;place-items:center;width:84px;height:84px;margin:0 auto 16px;border-radius:50%;background:rgba(244,148,12,.13);color:var(--lava);animation:float 5s ease-in-out infinite}
.empty .eico .ic{width:40px;height:40px}
@keyframes float{50%{transform:translateY(-7px)}}
.empty b{display:block;font-size:28px;line-height:1.1;color:var(--cream);margin-bottom:8px}
.skel{height:230px;border-radius:26px;background:linear-gradient(100deg,var(--surface) 30%,var(--surface-2) 50%,var(--surface) 70%);background-size:200% 100%;animation:shimmer 1.4s linear infinite;border:1.5px solid var(--line)}
@keyframes shimmer{to{background-position:-200% 0}}

/* Exportar */
.export{margin-top:30px;padding:20px;border:1.5px dashed var(--line-2);border-radius:22px;display:grid;gap:12px}
.export h2{font-size:24px;line-height:1}
.export p{color:var(--muted);font-size:15px}
.export .acts .chipbtn{min-height:50px}

/* Aviso con deshacer */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));translate:-50% 0;width:min(calc(100% - 24px),480px);display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:18px;background:var(--cream);color:var(--bg);font-weight:600;box-shadow:0 14px 34px rgba(0,0,0,.55);transform:translateY(24px);opacity:0;transition:transform .3s var(--out),opacity .2s;z-index:30}
.toast.on{transform:none;opacity:1}
.toast span{flex:1}
.toast button{font-weight:700;color:#bd1d1f;text-decoration:underline;min-height:44px;padding:0 6px}
.sr{position:absolute;left:-9999px}

@media (prefers-reduced-motion:reduce){.card,.kpi,.login,.empty .eico,.live::before,.flow li.on::before,.kpi.alert .kic,.tool[aria-pressed="true"] .ic{animation:none}.toast{transition:opacity .2s;transform:none}.skel{animation:none}.card[data-s="nuevo"].fresh{animation:none}}

/* Ticket de cocina: papel térmico de 80 mm. Al imprimir solo sale #ticket */
#ticket{display:none}
@media print{
  @page{size:80mm auto;margin:0}
  html,body{background:#fff !important;margin:0;padding:0}
  body > *:not(#ticket){display:none !important}
  #ticket{display:block;width:72mm;margin:0 auto;padding:4mm 0 8mm;color:#000;font:600 12pt/1.3 "Instrument Sans",system-ui,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #ticket *{color:#000;box-sizing:border-box}
  #ticket .t-brand{text-align:center;font:800 20pt/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.01em}
  #ticket .t-sub{text-align:center;font-size:9pt;font-weight:500;margin-top:1mm}
  #ticket hr{border:0;border-top:.4mm dashed #000;margin:3mm 0}
  #ticket .t-num{text-align:center;font:800 34pt/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em}
  #ticket .t-num small{display:block;font:700 12pt/1.2 "Instrument Sans",system-ui,sans-serif;letter-spacing:.08em;margin-top:1mm}
  #ticket .t-mode{margin:3mm 0 0;padding:2mm;border:.6mm solid #000;text-align:center;font:800 16pt/1 "Bricolage Grotesque",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em}
  #ticket .t-row{display:flex;justify-content:space-between;gap:3mm;font-size:10.5pt}
  #ticket .t-row span:last-child{text-align:right;font-weight:700}
  #ticket .t-who{font-size:12pt;font-weight:800}
  #ticket .t-item{display:grid;grid-template-columns:11mm 1fr auto;gap:0 2mm;align-items:baseline;margin:0 0 2.5mm;break-inside:avoid}
  #ticket .t-qty{font:800 18pt/1 "Bricolage Grotesque",system-ui,sans-serif}
  #ticket .t-name{font-weight:800;font-size:12.5pt;line-height:1.15}
  #ticket .t-amt{font-weight:700;font-size:11pt;white-space:nowrap}
  #ticket .t-opt{grid-column:2 / 4;font-size:10.5pt;font-weight:600;line-height:1.25}
  #ticket .t-note{grid-column:1 / 4;margin-top:1mm;padding:1.2mm 2mm;border:.4mm solid #000;font-size:10.5pt;font-weight:700}
  #ticket .t-box{margin:2mm 0;padding:2mm;border:.4mm solid #000;font-size:11pt;font-weight:700}
  #ticket .t-total{display:flex;justify-content:space-between;align-items:baseline;font:800 22pt/1 "Bricolage Grotesque",system-ui,sans-serif;margin-top:1mm}
  #ticket .t-total small{font:700 10pt/1 "Instrument Sans",system-ui,sans-serif}
  #ticket .t-foot{text-align:center;font-size:9pt;font-weight:500;margin-top:3mm}
}
</style>
</head>
<body>
<div id="ticket" aria-hidden="true"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-plus" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></g></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></g></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></g></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></g></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6L5 8zM9 8V6a3 3 0 0 1 6 0v2"/></g></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.500-5.600-6.500-11a6.500 6.500 0 0 1 13 0c0 5.400-6.500 11-6.500 11z"/><circle cx="12" cy="10" r="2.400"/></g></symbol>

      var it = add('t-item');
      it.appendChild(el('span', 't-qty', l.qty + '×'));
      var nm = el('span', 't-name', l.name + ' ' + l.portion); it.appendChild(nm);
      it.appendChild(el('span', 't-amt', money(l.total)));
      (l.choices || []).forEach(function (ch) { ch.options.forEach(function (op) { it.appendChild(el('span', 't-opt', (ch.group === 'salsa-extra' ? 'Extra: ' : '') + op.name)); }); });
      if (l.note) it.appendChild(el('span', 't-note', 'NOTA: ' + l.note));
    });
    if (c.notes) add('t-box', 'NOTA DEL PEDIDO: ' + c.notes);
    add('', '', 'hr');
    var t = add('t-total'); t.appendChild(el('span', '', 'TOTAL')); t.appendChild(el('span', '', money(o.total)));
    if (o.mode === 'delivery') add('t-foot', 'El envío se confirma por WhatsApp');
    add('t-foot', 'Gracias por pedir en Magma Wings');
    window.print();
  }

  function card(o, i) {
    var c = o.customer || {};
    var li = el('li', 'card' + (!first && !seen[o.key] && o.status === 'nuevo' ? ' fresh' : '')); li.dataset.s = o.status; li.dataset.key = o.key; li.style.animationDelay = Math.min(i, 8) * 40 + 'ms';

    /* Cabecera: número grande, estado, hora y total */
    var head = el('div', 'head'); var sp = split(o.orderId);
    var num = el('div', 'num'); var nb = el('div'); nb.appendChild(el('b', 'display', '#' + sp[0])); nb.appendChild(el('small', '', sp[1])); num.appendChild(nb); head.appendChild(num);
    var hm = el('div', 'hmain');
    var pill = el('span', 'pill'); pill.dataset.s = o.status; pill.appendChild(icon(SIC[o.status])); pill.appendChild(document.createTextNode(LABEL[o.status])); hm.appendChild(pill);
    var m = mins(o.createdAt), w = el('div', 'when' + (o.status === 'nuevo' && m >= 10 ? ' late' : (o.status === 'nuevo' && m >= 5 ? ' warn' : ''))); w.appendChild(icon('i-clock')); w.appendChild(document.createTextNode(ago(o.createdAt))); hm.appendChild(w);
    head.appendChild(hm);
    var tot = el('div', 'total display', money(o.total)); tot.appendChild(el('small', '', o.count + (o.count === 1 ? ' producto' : ' productos'))); head.appendChild(tot);
    li.appendChild(head);

    /* Avance */
    if (o.status !== 'cancelado') {
      var idx = ['nuevo', 'preparando', 'listo', 'entregado'].indexOf(o.status);
      var fl = el('ol', 'flow'); fl.setAttribute('aria-label', 'Avance del pedido');
      FLOW.forEach(function (f, n) {
        var it = el('li', (n <= idx ? 'on' : '') + (n === idx ? ' cur' : ''));
        var d = el('span', 'dot'); d.appendChild(icon(n < idx ? 'i-check' : f[2])); it.appendChild(d); it.appendChild(el('span', '', f[1])); fl.appendChild(it);
      });
      li.appendChild(fl);
    }

    /* Cliente */
    var who = el('div', 'who');
    var ini = ((c.firstName || c.name || '?').charAt(0) + (c.lastName || '').charAt(0)).toUpperCase();
    who.appendChild(el('span', 'avatar', ini));
    var wb = el('div', ''); var wn = el('div', 'wname', c.name || 'Sin nombre');
    var how = el('span', 'how'); how.appendChild(icon(o.mode === 'delivery' ? 'i-moto' : 'i-store')); how.appendChild(document.createTextNode(o.mode === 'delivery' ? 'Entrega' : 'Recojo')); wn.appendChild(how); wb.appendChild(wn);
    var meta = el('div', 'meta');
    if (c.phone) { var d1 = el('div'); d1.appendChild(icon('i-phone')); d1.appendChild(document.createTextNode(fmtPhone(c.phone))); meta.appendChild(d1); }
    if (c.email) { var d2 = el('div'); d2.appendChild(icon('i-mail')); d2.appendChild(document.createTextNode(c.email)); meta.appendChild(d2); }
    if (c.address) { var d3 = el('div'); d3.appendChild(icon('i-pin')); d3.appendChild(document.createTextNode(c.address)); meta.appendChild(d3); }
    wb.appendChild(meta); who.appendChild(wb); li.appendChild(who);

    /* Productos */
    var ul = el('ul', 'items');
    o.lines.forEach(function (l) {
      var it = el('li', 'item'); var ic = el('span', 'iico'); ic.appendChild(icon(ICO[l.name] || 'i-flame')); it.appendChild(ic);
      var nm = el('div', 'iname', l.qty + ' × ' + l.name); nm.appendChild(el('span', '', l.portion)); it.appendChild(nm);
      it.appendChild(el('span', 'iamt', money(l.total)));
      var tg = el('ul', 'tags');
      (l.choices || []).forEach(function (ch) { ch.options.forEach(function (op) { var t = el('li'); t.appendChild(icon(GIC[ch.group] || 'i-drop')); t.appendChild(document.createTextNode((ch.group === 'salsa-extra' ? 'Extra: ' : '') + op.name + (op.price ? ' +' + op.price : ''))); tg.appendChild(t); }); });
      if (l.note) { var tn = el('li', 'note'); tn.appendChild(icon('i-note')); tn.appendChild(document.createTextNode(l.note)); tg.appendChild(tn); }
      if (tg.children.length) it.appendChild(tg);
      ul.appendChild(it);
    });
    li.appendChild(ul);
    if (c.notes) { var co = el('p', 'callout'); co.appendChild(icon('i-note')); co.appendChild(document.createTextNode(c.notes)); li.appendChild(co); }

    /* Acciones */
    var acts = el('div', 'acts');
    if (c.phone) {
      var wa = el('a', 'chipbtn wa'); wa.href = 'https://wa.me/' + c.phone + '?text=' + encodeURIComponent(msgFor(o)); wa.target = '_blank'; wa.rel = 'noopener';
      wa.appendChild(icon('i-wa')); wa.appendChild(document.createTextNode('Escribirle')); acts.appendChild(wa);
      var tel = el('a', 'chipbtn'); tel.href = 'tel:+' + c.phone; tel.appendChild(icon('i-phone')); tel.appendChild(document.createTextNode('Llamar')); acts.appendChild(tel);
    }
    var cp = el('button', 'chipbtn'); cp.type = 'button'; cp.appendChild(icon('i-copy')); var cpt = document.createTextNode('Copiar'); cp.appendChild(cpt);
    cp.addEventListener('click', function () { (navigator.clipboard ? navigator.clipboard.writeText(o.message) : Promise.reject()).then(function () { cpt.nodeValue = 'Copiado'; setTimeout(function () { cpt.nodeValue = 'Copiar'; }, 1500); }, function () { cpt.nodeValue = 'No se pudo'; }); });
    acts.appendChild(cp);
    var pr = el('button', 'chipbtn'); pr.type = 'button'; pr.appendChild(icon('i-print')); pr.appendChild(document.createTextNode('Ticket'));
    pr.addEventListener('click', function () { printTicket(o); });
    acts.appendChild(pr);
    li.appendChild(acts);

    if (NEXT[o.status]) {
      var nx = el('button', 'primary next'); nx.type = 'button'; nx.dataset.s = o.status; nx.appendChild(icon(NEXT[o.status][2])); nx.appendChild(document.createTextNode(NEXT[o.status][1]));
      nx.addEventListener('click', function () { change(o, NEXT[o.status][0]); });
      li.appendChild(nx);
    }
    var sec = el('div', 'sec');
    if (o.status === 'entregado' || o.status === 'cancelado') {
      var re = el('button', 'link'); re.type = 'button'; re.appendChild(icon('i-refresh')); re.appendChild(document.createTextNode('Reabrir pedido')); re.addEventListener('click', function () { change(o, 'nuevo'); }); sec.appendChild(re);
    } else {
      var ca = el('button', 'link danger'); ca.type = 'button'; ca.appendChild(icon('i-x')); ca.appendChild(document.createTextNode(confirmCancel === o.key ? 'Toca otra vez para cancelar' : 'Cancelar pedido'));
      ca.addEventListener('click', function () { if (confirmCancel === o.key) change(o, 'cancelado'); else { confirmCancel = o.key; render(); setTimeout(function () { if (confirmCancel === o.key) { confirmCancel = ''; render(); } }, 4000); } });
      sec.appendChild(ca);
    }
    li.appendChild(sec);
    return li;
  }

  function download(name, rows) {
    var q = function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
    var blob = new Blob(['﻿' + rows.map(function (r) { return r.map(q).join(','); }).join('\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
  function csvAll() {
    var rows = [['Pedido', 'Fecha', 'Estado', 'Nombre', 'Apellido', 'Celular', 'Correo', 'Tipo', 'Dirección', 'Notas', 'Productos', 'Total (Bs)', 'Acepta ofertas']];
    orders.forEach(function (o) { var c = o.customer; rows.push([o.orderId, o.createdAt, LABEL[o.status], c.firstName || c.name, c.lastName || '', c.phone ? '+' + c.phone : '', c.email || '', o.mode === 'delivery' ? 'Entrega' : 'Recojo', c.address, c.notes, o.lines.map(function (l) { return l.qty + 'x ' + l.name + ' ' + l.portion; }).join(' | '), o.total, c.consent ? 'Sí' : 'No']); });
    download('pedidos-magma.csv', rows);
  }
  /* Formato de Meta para "Lista de clientes": email, phone, fn, ln, country, value */
  function csvAudience() {
    var seenC = {}, rows = [['email', 'phone', 'fn', 'ln', 'country', 'value']];
    orders.forEach(function (o) {
      var c = o.customer; if (!c.consent) return;
      var id = c.phone || c.email; if (!id || seenC[id]) return; seenC[id] = 1;
      var tot = orders.filter(function (x) { return x.customer.phone === c.phone && x.status !== 'cancelado'; }).reduce(function (s, x) { return s + x.total; }, 0);
      rows.push([c.email || '', c.phone || '', (c.firstName || '').toLowerCase(), (c.lastName || '').toLowerCase(), 'bo', tot]);
    });
    if (rows.length === 1) { toast('Todavía no hay clientes que hayan aceptado ofertas.'); return; }
    download('audiencia-meta-magma.csv', rows);
  }

  function enter() {
    $('#login').hidden = true; $('#panel').hidden = false;
    ['#sound', '#refresh', '#logout'].forEach(function (s) { $(s).hidden = false; });
    clearInterval(timer); clearInterval(tick);
    timer = setInterval(function () { if (!document.hidden) load().catch(function () {}); }, 20000);
    tick = setInterval(function () { if (!document.hidden && !$('#panel').hidden) { render(); var s = Math.round((Date.now() - loadedAt) / 1000); if (s > 45) setLive(false); } }, 60000);
  }
  function leave(msg) {
    token = ''; put(KEY, ''); clearInterval(timer); clearInterval(tick); lastNew = null; first = true;
    $('#login').hidden = false; $('#panel').hidden = true; $('#live').hidden = true;
    ['#sound', '#refresh', '#logout'].forEach(function (s) { $(s).hidden = true; });
    var e = $('#err'); e.textContent = msg || ''; e.hidden = !msg;
  }
  function showSkeleton() { $('#login').hidden = true; $('#panel').hidden = false; var l = $('#list'); l.textContent = ''; for (var i = 0; i < 2; i++) l.appendChild(el('li', 'skel')); }

  $('#login').addEventListener('submit', function (ev) {
    ev.preventDefault(); token = $('#tk').value.trim();
    load().then(function () { put(KEY, token); enter(); }).catch(function (e) { leave(e.message); });
  });
  $('#refresh').addEventListener('click', function () { load().then(function () { toast('Actualizado'); }).catch(function (e) { leave(e.message); }); });
  $('#logout').addEventListener('click', function () { leave(''); });
  $('#csv').addEventListener('click', csvAll);
  $('#aud').addEventListener('click', csvAudience);
  $('#q').addEventListener('input', function (e) { query = e.target.value; render(); });
  $('#sound').addEventListener('click', function () {
    soundOn = !soundOn; put(SND, soundOn ? '1' : ''); this.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    if (soundOn) { beep(); toast('Sonará cuando entre un pedido. Deja esta pestaña abierta.'); }
  });

  soundOn = get(SND) === '1'; $('#sound').setAttribute('aria-pressed', soundOn ? 'true' : 'false');
  tab = get(TAB) || 'nuevo';
  token = get(KEY);
  if (token) { showSkeleton(); load().then(function () { if (!orders.some(function (o) { return o.status === tab; }) && tab !== 'todos') tab = orders.some(function (o) { return o.status === 'nuevo'; }) ? 'nuevo' : 'todos'; enter(); render(); }).catch(function (e) { leave(e.message); }); }
})();
</script>
</body>
</html>
